<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>amCharts 5 Example - Arc Diagram (JSON config)</title>

    <!-- Styles -->
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
        padding: 0;
        margin: 0;
        background-color: #ffffff;
      }

      #chartdiv {
        width: 100%;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="chartdiv"></div>

    <!-- Resources -->
    <script src="../../index.js"></script>
    <script src="../../flow.js"></script>
    <script src="../../themes/Animated.js"></script>
    <script src="../../plugins/json.js"></script>

    <!-- Chart code -->
    <script>
      // The chart as a JSON config. The code that builds the chart from it is below
      // how a config reads:
      // "type" is the class to create, and "settings" are what you would pass to its new() in code
      // "properties" fill in its parts: lists such as series and axes, or templates such as columns.template
      // "refs" holds objects used in more than one place: "#series-0" stands for the one named series-0
      // a string starting with "@" takes a value from another object, such as "@series.get('fill')"
      // https://www.amcharts.com/docs/v5/concepts/serializing/
      var config = {
        "type": "ArcDiagram",
        "settings": {
          "sourceIdField": "source",
          "targetIdField": "target",
          "valueField": "value",
          "orientation": "horizontal",
          "paddingBottom": 70,
          "autoAppear": true,
          "appearDuration": 1000,
          "appearDelay": 100
        },
        "properties": {
          "data": "#data-0",
          "nodes": {
            "properties": {
              "labels": {
                "properties": {
                  "template": {
                    "settings": {
                      "fontSize": "0.85em",
                      "position": "absolute",
                      "y": { "type": "Percent", "value": 50 },
                      "paddingRight": 6
                    }
                  }
                }
              }
            }
          }
        },
        "refs": [
          {
            "data-0": [
              { "source": "Monica", "target": "Rachel", "value": 4 },
              { "source": "Monica", "target": "Chandler", "value": 63 },
              { "source": "Monica", "target": "Ross", "value": 16 },
              { "source": "Monica", "target": "Joey", "value": 9 },
              { "source": "Monica", "target": "Phoebe", "value": 3 },
              { "source": "Monica", "target": "Pete", "value": 10 },
              { "source": "Rachel", "target": "Chandler", "value": 7 },
              { "source": "Rachel", "target": "Ross", "value": 80 },
              { "source": "Rachel", "target": "Joey", "value": 30 },
              { "source": "Rachel", "target": "Phoebe", "value": 6 },
              { "source": "Rachel", "target": "Tag", "value": 4 },
              { "source": "Chandler", "target": "Joey", "value": 1 },
              { "source": "Chandler", "target": "Phoebe", "value": 7 },
              { "source": "Chandler", "target": "Janice", "value": 11 },
              { "source": "Chandler", "target": "Kathy", "value": 7 },
              { "source": "Ross", "target": "Joey", "value": 3 },
              { "source": "Ross", "target": "Phoebe", "value": 18 },
              { "source": "Ross", "target": "Carol", "value": 10 },
              { "source": "Ross", "target": "Emily", "value": 12 },
              { "source": "Ross", "target": "Mona", "value": 11 },
              { "source": "Ross", "target": "Charlie", "value": 10 },
              { "source": "Joey", "target": "Phoebe", "value": 6 },
              { "source": "Joey", "target": "Janine", "value": 9 },
              { "source": "Joey", "target": "Charlie", "value": 3 },
              { "source": "Phoebe", "target": "David", "value": 14 },
              { "source": "Phoebe", "target": "Mike", "value": 18 }
            ]
          }
        ]
      };


      // Create root element
      // https://www.amcharts.com/docs/v5/getting-started/#Root_element
      var root = am5.Root.new("chartdiv");


      // Set themes
      // https://www.amcharts.com/docs/v5/concepts/themes/
      root.setThemes([
        am5themes_Animated.new(root)
      ]);


      // Build the chart from its JSON config
      // https://www.amcharts.com/docs/v5/concepts/serializing/
      am5plugins_json.JsonParser.new(root).parse(config, {
        parent: root.container
      });
    </script>
  </body>
</html>
