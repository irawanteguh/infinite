<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>amCharts 5 Example - Chord Diagram with Moving Bullets (JSON config)</title>

    <!-- Styles -->
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
        padding: 0;
        margin: 0;
        background-color: #ffffff;
      }

      #chartdiv {
        width: 100%;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="chartdiv"></div>

    <!-- Resources -->
    <script src="../../index.js"></script>
    <script src="../../flow.js"></script>
    <script src="../../themes/Animated.js"></script>
    <script src="../../plugins/json.js"></script>

    <!-- Chart code -->
    <script>
      // A similar chart, not the same as the code version:
      // Giving each circle the color of its node takes code, so here they are all one color.

      // The chart as a JSON config. The code that builds the chart from it is below
      // how a config reads:
      // "type" is the class to create, and "settings" are what you would pass to its new() in code
      // "properties" fill in its parts: lists such as series and axes, or templates such as columns.template
      // "refs" holds objects used in more than one place: "#series-0" stands for the one named series-0
      // a string starting with "@" takes a value from another object, such as "@series.get('fill')"
      // https://www.amcharts.com/docs/v5/concepts/serializing/
      var config = {
        "type": "ChordNonRibbon",
        "settings": {
          "sourceIdField": "source",
          "targetIdField": "target",
          "valueField": "value",
          "autoAppear": true,
          "appearDuration": 1000,
          "appearDelay": 100
        },
        "properties": {
          "data": "#data-0",
          "nodes": {
            "properties": {
              "labels": {
                "properties": {
                  "template": {
                    "settings": {
                      "textType": "regular",
                      "fill": { "type": "Color", "value": "#ffffff" },
                      "radius": -5
                    },
                    "states": [
                      {
                        "key": "disabled",
                        "settings": {
                          "fill": { "type": "Color", "value": "#ffffff" }
                        }
                      }
                    ]
                  }
                }
              },
              "bullets": [
                {
                  "type": "Bullet",
                  "settings": {
                    "sprite": {
                      "type": "Circle",
                      "settings": {
                        "radius": 24,
                        "fill": { "type": "Color", "value": "#67b7dc" }
                      },
                      "states": [
                        {
                          "key": "hidden",
                          "settings": {
                            "fill": { "type": "Color", "value": "#adadad" }
                          }
                        }
                      ]
                    }
                  }
                }
              ]
            },
            "settings": {
              "colors": {
                "type": "ColorSet",
                "settings": {
                  "step": 2,
                  "passOptions": { "hue": 0.05, "saturation": 0, "lightness": 0 },
                  "colors": [
                    { "type": "Color", "value": "#67b7dc" },
                    { "type": "Color", "value": "#6794dc" },
                    { "type": "Color", "value": "#6771dc" },
                    { "type": "Color", "value": "#8067dc" },
                    { "type": "Color", "value": "#a367dc" },
                    { "type": "Color", "value": "#c767dc" },
                    { "type": "Color", "value": "#dc67ce" },
                    { "type": "Color", "value": "#dc67ab" },
                    { "type": "Color", "value": "#dc6788" },
                    { "type": "Color", "value": "#dc6967" },
                    { "type": "Color", "value": "#dc8c67" },
                    { "type": "Color", "value": "#dcaf67" },
                    { "type": "Color", "value": "#dcd267" }
                  ],
                  "reuse": false,
                  "startIndex": 0,
                  "stateAnimationDuration": 600
                }
              }
            }
          },
          "bullets": [
            {
              "type": "Bullet",
              "settings": {
                "animations": [
                  {
                    "key": "locationY",
                    "from": 0,
                    "to": 1,
                    "duration": 2000,
                    "loops": 0,
                    "yoyo": true,
                    "easing": "cubic",
                    "ease": "inOut"
                  }
                ],
                "sprite": {
                  "type": "Circle",
                  "settings": {
                    "radius": 5,
                    "fill": { "type": "Color", "value": "#67b7dc" }
                  }
                }
              }
            }
          ]
        },
        "refs": [
          {
            "data-0": [
              { "source": "LHR", "target": "JFK", "value": 24 },
              { "source": "LHR", "target": "DXB", "value": 18 },
              { "source": "LHR", "target": "CDG", "value": 14 },
              { "source": "CDG", "target": "JFK", "value": 12 },
              { "source": "CDG", "target": "FRA", "value": 10 },
              { "source": "FRA", "target": "DXB", "value": 9 },
              { "source": "FRA", "target": "SIN", "value": 6 },
              { "source": "DXB", "target": "SIN", "value": 11 },
              { "source": "JFK", "target": "LAX", "value": 30 },
              { "source": "LAX", "target": "SIN", "value": 4 }
            ]
          }
        ]
      };


      // Create root element
      // https://www.amcharts.com/docs/v5/getting-started/#Root_element
      var root = am5.Root.new("chartdiv");


      // Set themes
      // https://www.amcharts.com/docs/v5/concepts/themes/
      root.setThemes([
        am5themes_Animated.new(root)
      ]);


      // Build the chart from its JSON config
      // https://www.amcharts.com/docs/v5/concepts/serializing/
      am5plugins_json.JsonParser.new(root).parse(config, {
        parent: root.container
      });
    </script>
  </body>
</html>
