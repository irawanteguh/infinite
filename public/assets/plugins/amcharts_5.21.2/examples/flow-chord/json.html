<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>amCharts 5 Example - Chord Diagram (JSON config)</title>

    <!-- Styles -->
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
        padding: 0;
        margin: 0;
        background-color: #ffffff;
      }

      #chartdiv {
        width: 100%;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="chartdiv"></div>

    <!-- Resources -->
    <script src="../../index.js"></script>
    <script src="../../flow.js"></script>
    <script src="../../themes/Animated.js"></script>
    <script src="../../plugins/json.js"></script>

    <!-- Chart code -->
    <script>
      // The chart as a JSON config. The code that builds the chart from it is below
      // how a config reads:
      // "type" is the class to create, and "settings" are what you would pass to its new() in code
      // "properties" fill in its parts: lists such as series and axes, or templates such as columns.template
      // "refs" holds objects used in more than one place: "#series-0" stands for the one named series-0
      // a string starting with "@" takes a value from another object, such as "@series.get('fill')"
      // https://www.amcharts.com/docs/v5/concepts/serializing/
      var config = {
        "type": "Chord",
        "settings": {
          "sourceIdField": "source",
          "targetIdField": "target",
          "valueField": "value",
          "autoAppear": true,
          "appearDuration": 1000,
          "appearDelay": 100
        },
        "properties": {
          "data": "#data-0",
          "nodes": {
            "settings": {
              "colors": {
                "type": "ColorSet",
                "settings": {
                  "step": 2,
                  "passOptions": { "hue": 0.05, "saturation": 0, "lightness": 0 },
                  "colors": [
                    { "type": "Color", "value": "#67b7dc" },
                    { "type": "Color", "value": "#6794dc" },
                    { "type": "Color", "value": "#6771dc" },
                    { "type": "Color", "value": "#8067dc" },
                    { "type": "Color", "value": "#a367dc" },
                    { "type": "Color", "value": "#c767dc" },
                    { "type": "Color", "value": "#dc67ce" },
                    { "type": "Color", "value": "#dc67ab" },
                    { "type": "Color", "value": "#dc6788" }
                  ],
                  "reuse": false,
                  "startIndex": 0,
                  "stateAnimationDuration": 600
                }
              }
            }
          }
        },
        "refs": [
          {
            "data-0": [
              { "source": "Berlin", "target": "Amsterdam", "value": 14 },
              { "source": "Berlin", "target": "London", "value": 33 },
              { "source": "Berlin", "target": "Paris", "value": 13 },
              { "source": "Berlin", "target": "Madrid", "value": 36 },
              { "source": "Amsterdam", "target": "Berlin", "value": 42 },
              { "source": "Amsterdam", "target": "London", "value": 20 },
              { "source": "Amsterdam", "target": "Paris", "value": 19 },
              { "source": "Amsterdam", "target": "Madrid", "value": 11 },
              { "source": "London", "target": "Amsterdam", "value": 9 },
              { "source": "London", "target": "Berlin", "value": 38 },
              { "source": "London", "target": "Paris", "value": 41 },
              { "source": "London", "target": "Madrid", "value": 16 },
              { "source": "Paris", "target": "Amsterdam", "value": 12 },
              { "source": "Paris", "target": "London", "value": 16 },
              { "source": "Paris", "target": "Berlin", "value": 21 },
              { "source": "Paris", "target": "Madrid", "value": 8 },
              { "source": "Madrid", "target": "Amsterdam", "value": 22 },
              { "source": "Madrid", "target": "London", "value": 25 },
              { "source": "Madrid", "target": "Paris", "value": 19 },
              { "source": "Madrid", "target": "Berlin", "value": 7 }
            ]
          }
        ]
      };


      // Create root element
      // https://www.amcharts.com/docs/v5/getting-started/#Root_element
      var root = am5.Root.new("chartdiv");


      // Set themes
      // https://www.amcharts.com/docs/v5/concepts/themes/
      root.setThemes([
        am5themes_Animated.new(root)
      ]);


      // Build the chart from its JSON config
      // https://www.amcharts.com/docs/v5/concepts/serializing/
      am5plugins_json.JsonParser.new(root).parse(config, {
        parent: root.container
      });
    </script>
  </body>
</html>
