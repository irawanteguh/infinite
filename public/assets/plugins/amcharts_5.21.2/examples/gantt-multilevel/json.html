<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>amCharts 5 Example - Gantt Chart with Subtasks (JSON config)</title>

    <!-- Styles -->
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
        padding: 0;
        margin: 0;
        background-color: #ffffff;
      }

      #chartdiv {
        width: 100%;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="chartdiv"></div>

    <!-- Resources -->
    <script src="../../index.js"></script>
    <script src="../../xy.js"></script>
    <script src="../../plugins/colorPicker.js"></script>
    <script src="../../gantt.js"></script>
    <script src="../../themes/Animated.js"></script>
    <script src="../../plugins/json.js"></script>

    <!-- Chart code -->
    <script>
      // The chart as a JSON config. The code that builds the chart from it is below
      // how a config reads:
      // "type" is the class to create, and "settings" are what you would pass to its new() in code
      // "properties" fill in its parts: lists such as series and axes, or templates such as columns.template
      // "refs" holds objects used in more than one place: "#series-0" stands for the one named series-0
      // a string starting with "@" takes a value from another object, such as "@series.get('fill')"
      // https://www.amcharts.com/docs/v5/concepts/serializing/
      var config = {
        "type": "Gantt",
        "settings": { "autoAppear": true, "appearDuration": 1000, "appearDelay": 100 },
        "properties": {
          "yAxis": {
            "properties": { "data": "#data-0" }
          },
          "series": {
            "properties": { "data": "#data-1" }
          }
        },
        "refs": [
          {
            "data-0": [
              { "id": "kickoff", "name": "Kick-off", "color": "#6794dc" },
              { "id": "design", "name": "Design", "color": "#6771dc", "collapsed": false },
              { "id": "wireframes", "name": "Wireframes", "parentId": "design", "color": "#6771dc" },
              { "id": "visuals", "name": "Visual design", "parentId": "design", "color": "#6771dc" },
              { "id": "development", "name": "Development", "color": "#8067dc", "collapsed": false },
              { "id": "frontend", "name": "Front end", "parentId": "development", "color": "#8067dc" },
              { "id": "backend", "name": "Back end", "parentId": "development", "color": "#8067dc" },
              { "id": "testing", "name": "Testing", "parentId": "development", "color": "#8067dc" },
              { "id": "launch", "name": "Launch", "color": "#a367dc" }
            ]
          },
          {
            "data-1": [
              {
                "id": "kickoff",
                "start": 1758142800000,
                "duration": 0,
                "progress": 1,
                "linkTo": ["design"],
                "end": 1758142800000,
                "__parse": true
              },
              {
                "id": "design",
                "linkTo": ["development"],
                "__parse": true
              },
              {
                "id": "wireframes",
                "start": 1758142800000,
                "duration": 2,
                "progress": 1,
                "linkTo": ["visuals"],
                "end": 1758315600000,
                "__parse": true
              },
              { "id": "visuals", "start": 1758488400000, "duration": 4, "progress": 0.75, "end": 1758834000000 },
              {
                "id": "development",
                "linkTo": ["launch"],
                "__parse": true
              },
              {
                "id": "frontend",
                "start": 1758834000000,
                "duration": 4,
                "progress": 0.2,
                "linkTo": ["testing"],
                "end": 1759352400000,
                "__parse": true
              },
              {
                "id": "backend",
                "start": 1758834000000,
                "duration": 3,
                "progress": 0,
                "linkTo": ["testing"],
                "end": 1759266000000,
                "__parse": true
              },
              { "id": "testing", "start": 1759352400000, "duration": 2, "progress": 0, "end": 1759525200000 },
              { "id": "launch", "start": 1759698000000, "duration": 0, "progress": 0, "end": 1759698000000 }
            ]
          }
        ]
      };


      // Create root element
      // https://www.amcharts.com/docs/v5/getting-started/#Root_element
      var root = am5.Root.new("chartdiv");


      // Set themes
      // https://www.amcharts.com/docs/v5/concepts/themes/
      root.setThemes([
        am5themes_Animated.new(root)
      ]);


      // Build the chart from its JSON config
      // https://www.amcharts.com/docs/v5/concepts/serializing/
      am5plugins_json.JsonParser.new(root).parse(config, {
        parent: root.container
      });
    </script>
  </body>
</html>
