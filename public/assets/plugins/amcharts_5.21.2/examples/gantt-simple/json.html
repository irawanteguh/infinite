<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>amCharts 5 Example - Gantt Chart (JSON config)</title>

    <!-- Styles -->
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
        padding: 0;
        margin: 0;
        background-color: #ffffff;
      }

      #chartdiv {
        width: 100%;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="chartdiv"></div>

    <!-- Resources -->
    <script src="../../index.js"></script>
    <script src="../../xy.js"></script>
    <script src="../../plugins/colorPicker.js"></script>
    <script src="../../gantt.js"></script>
    <script src="../../themes/Animated.js"></script>
    <script src="../../plugins/json.js"></script>

    <!-- Chart code -->
    <script>
      // The chart as a JSON config. The code that builds the chart from it is below
      // how a config reads:
      // "type" is the class to create, and "settings" are what you would pass to its new() in code
      // "properties" fill in its parts: lists such as series and axes, or templates such as columns.template
      // "refs" holds objects used in more than one place: "#series-0" stands for the one named series-0
      // a string starting with "@" takes a value from another object, such as "@series.get('fill')"
      // https://www.amcharts.com/docs/v5/concepts/serializing/
      var config = {
        "type": "Gantt",
        "settings": { "autoAppear": true, "appearDuration": 1000, "appearDelay": 100 },
        "properties": {
          "yAxis": {
            "properties": { "data": "#data-0" }
          },
          "series": {
            "properties": { "data": "#data-1" }
          }
        },
        "refs": [
          {
            "data-0": [
              { "id": "gantt_0", "name": "Idea", "color": "#6794dc" },
              { "id": "gantt_1", "name": "Kick-off", "color": "#6771dc" },
              { "id": "gantt_2", "name": "Planning", "color": "#8067dc" },
              { "id": "gantt_3", "name": "Development", "color": "#a367dc" },
              { "id": "gantt_4", "name": "Testing", "color": "#c767dc" },
              { "id": "gantt_5", "name": "Finalization", "color": "#dc67ce" },
              { "id": "gantt_6", "name": "Release", "color": "#dc67ab" }
            ]
          },
          {
            "data-1": [
              {
                "id": "gantt_0",
                "start": 1758142800000,
                "duration": 0,
                "progress": 0,
                "linkTo": ["gantt_1"],
                "end": 1758142800000,
                "__parse": true
              },
              {
                "id": "gantt_1",
                "start": 1758142800000,
                "duration": 2,
                "progress": 0,
                "linkTo": ["gantt_2"],
                "end": 1758315600000,
                "__parse": true
              },
              {
                "id": "gantt_2",
                "start": 1758488400000,
                "duration": 2,
                "progress": 0,
                "linkTo": ["gantt_3"],
                "end": 1758661200000,
                "__parse": true
              },
              {
                "id": "gantt_3",
                "start": 1758661200000,
                "duration": 1,
                "progress": 0,
                "linkTo": ["gantt_4"],
                "end": 1758747600000,
                "__parse": true
              },
              {
                "id": "gantt_4",
                "start": 1758747600000,
                "duration": 3,
                "progress": 0,
                "linkTo": ["gantt_5"],
                "end": 1759179600000,
                "__parse": true
              },
              {
                "id": "gantt_5",
                "start": 1759179600000,
                "duration": 0,
                "progress": 0,
                "linkTo": ["gantt_6"],
                "end": 1759179600000,
                "__parse": true
              },
              { "id": "gantt_6", "start": 1759179600000, "duration": 4, "progress": 0, "end": 1759525200000 }
            ]
          }
        ]
      };


      // Create root element
      // https://www.amcharts.com/docs/v5/getting-started/#Root_element
      var root = am5.Root.new("chartdiv");


      // Set themes
      // https://www.amcharts.com/docs/v5/concepts/themes/
      root.setThemes([
        am5themes_Animated.new(root)
      ]);


      // Build the chart from its JSON config
      // https://www.amcharts.com/docs/v5/concepts/serializing/
      am5plugins_json.JsonParser.new(root).parse(config, {
        parent: root.container
      });
    </script>
  </body>
</html>
