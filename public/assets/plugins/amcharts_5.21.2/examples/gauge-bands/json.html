<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>amCharts 5 Example - Gauge with Bands (JSON config)</title>

    <!-- Styles -->
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
        padding: 0;
        margin: 0;
        background-color: #ffffff;
      }

      #chartdiv {
        width: 100%;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="chartdiv"></div>

    <!-- Resources -->
    <script src="../../index.js"></script>
    <script src="../../xy.js"></script>
    <script src="../../radar.js"></script>
    <script src="../../themes/Animated.js"></script>
    <script src="../../plugins/json.js"></script>

    <!-- Chart code -->
    <script>
      // A similar chart, not the same as the code version:
      // Moving the hand and coloring it by its band take code.

      // The chart as a JSON config. The code that builds the chart from it is below
      // how a config reads:
      // "type" is the class to create, and "settings" are what you would pass to its new() in code
      // "properties" fill in its parts: lists such as series and axes, or templates such as columns.template
      // "refs" holds objects used in more than one place: "#series-0" stands for the one named series-0
      // a string starting with "@" takes a value from another object, such as "@series.get('fill')"
      // https://www.amcharts.com/docs/v5/concepts/serializing/
      var config = {
        "type": "RadarChart",
        "settings": {
          "panX": false,
          "panY": false,
          "startAngle": 160,
          "endAngle": 380,
          "autoAppear": true,
          "appearDuration": 1000,
          "appearDelay": 100
        },
        "properties": {
          "xAxes": ["#axis-0"],
          "radarContainer": {
            "children": [
              {
                "type": "Label",
                "settings": {
                  "fill": { "type": "Color", "value": "#ffffff" },
                  "centerX": { "type": "Percent", "value": 50 },
                  "centerY": { "type": "Percent", "value": 50 },
                  "textAlign": "center",
                  "fontSize": "3em",
                  "text": "82"
                }
              }
            ]
          }
        },
        "refs": [
          {
            "axis-0": {
              "type": "ValueAxis",
              "settings": {
                "maxDeviation": 0,
                "min": -40,
                "max": 100,
                "strictMinMax": true,
                "renderer": {
                  "type": "AxisRendererCircular",
                  "settings": { "innerRadius": -40 },
                  "properties": {
                    "grid": {
                      "properties": {
                        "template": {
                          "settings": {
                            "stroke": { "type": "Color", "value": "#ffffff" },
                            "visible": true,
                            "strokeOpacity": 0.8,
                            "strokeWidth": 2,
                            "crisp": false
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          },
          {
            "axisRange-0": {
              "axis": "#axis-0",
              "settings": {
                "above": true,
                "value": -40,
                "endValue": -20,
                "label": {
                  "type": "AxisLabelRadial",
                  "settings": {
                    "radius": 15,
                    "inside": true,
                    "fontSize": "0.9em",
                    "fill": { "type": "Color", "value": "#ffffff" },
                    "text": "Unsustainable"
                  }
                },
                "axisFill": {
                  "type": "Slice",
                  "settings": {
                    "visible": true,
                    "fill": { "type": "Color", "value": "#ee1f25" },
                    "fillOpacity": 0.8
                  }
                }
              },
              "__parseLogic": "axisRange"
            }
          },
          {
            "axisRange-1": {
              "axis": "#axis-0",
              "settings": {
                "above": true,
                "value": -20,
                "endValue": 0,
                "label": {
                  "type": "AxisLabelRadial",
                  "settings": {
                    "radius": 15,
                    "inside": true,
                    "fontSize": "0.9em",
                    "fill": { "type": "Color", "value": "#ffffff" },
                    "text": "Volatile"
                  }
                },
                "axisFill": {
                  "type": "Slice",
                  "settings": {
                    "visible": true,
                    "fill": { "type": "Color", "value": "#f04922" },
                    "fillOpacity": 0.8
                  }
                }
              },
              "__parseLogic": "axisRange"
            }
          },
          {
            "axisRange-2": {
              "axis": "#axis-0",
              "settings": {
                "above": true,
                "value": 0,
                "endValue": 20,
                "label": {
                  "type": "AxisLabelRadial",
                  "settings": {
                    "radius": 15,
                    "inside": true,
                    "fontSize": "0.9em",
                    "fill": { "type": "Color", "value": "#ffffff" },
                    "text": "Foundational"
                  }
                },
                "axisFill": {
                  "type": "Slice",
                  "settings": {
                    "visible": true,
                    "fill": { "type": "Color", "value": "#fdae19" },
                    "fillOpacity": 0.8
                  }
                }
              },
              "__parseLogic": "axisRange"
            }
          },
          {
            "axisRange-3": {
              "axis": "#axis-0",
              "settings": {
                "above": true,
                "value": 20,
                "endValue": 40,
                "label": {
                  "type": "AxisLabelRadial",
                  "settings": {
                    "radius": 15,
                    "inside": true,
                    "fontSize": "0.9em",
                    "fill": { "type": "Color", "value": "#ffffff" },
                    "text": "Developing"
                  }
                },
                "axisFill": {
                  "type": "Slice",
                  "settings": {
                    "visible": true,
                    "fill": { "type": "Color", "value": "#f3eb0c" },
                    "fillOpacity": 0.8
                  }
                }
              },
              "__parseLogic": "axisRange"
            }
          },
          {
            "axisRange-4": {
              "axis": "#axis-0",
              "settings": {
                "above": true,
                "value": 40,
                "endValue": 60,
                "label": {
                  "type": "AxisLabelRadial",
                  "settings": {
                    "radius": 15,
                    "inside": true,
                    "fontSize": "0.9em",
                    "fill": { "type": "Color", "value": "#ffffff" },
                    "text": "Maturing"
                  }
                },
                "axisFill": {
                  "type": "Slice",
                  "settings": {
                    "visible": true,
                    "fill": { "type": "Color", "value": "#b0d136" },
                    "fillOpacity": 0.8
                  }
                }
              },
              "__parseLogic": "axisRange"
            }
          },
          {
            "axisRange-5": {
              "axis": "#axis-0",
              "settings": {
                "above": true,
                "value": 60,
                "endValue": 80,
                "label": {
                  "type": "AxisLabelRadial",
                  "settings": {
                    "radius": 15,
                    "inside": true,
                    "fontSize": "0.9em",
                    "fill": { "type": "Color", "value": "#ffffff" },
                    "text": "Sustainable"
                  }
                },
                "axisFill": {
                  "type": "Slice",
                  "settings": {
                    "visible": true,
                    "fill": { "type": "Color", "value": "#54b947" },
                    "fillOpacity": 0.8
                  }
                }
              },
              "__parseLogic": "axisRange"
            }
          },
          {
            "axisRange-6": {
              "axis": "#axis-0",
              "settings": {
                "above": true,
                "value": 80,
                "endValue": 100,
                "label": {
                  "type": "AxisLabelRadial",
                  "settings": {
                    "radius": 15,
                    "inside": true,
                    "fontSize": "0.9em",
                    "fill": { "type": "Color", "value": "#ffffff" },
                    "text": "High Performing"
                  }
                },
                "axisFill": {
                  "type": "Slice",
                  "settings": {
                    "visible": true,
                    "fill": { "type": "Color", "value": "#0f9747" },
                    "fillOpacity": 0.8
                  }
                }
              },
              "__parseLogic": "axisRange"
            }
          },
          {
            "axisRange-7": {
              "axis": "#axis-0",
              "settings": {
                "value": 82.43356914899199,
                "bullet": {
                  "type": "AxisBullet",
                  "settings": {
                    "sprite": {
                      "type": "ClockHand",
                      "settings": {
                        "pinRadius": { "type": "Percent", "value": 20 },
                        "radius": { "type": "Percent", "value": 100 },
                        "bottomWidth": 40
                      }
                    }
                  }
                }
              },
              "__parseLogic": "axisRange"
            }
          }
        ]
      };


      // Create root element
      // https://www.amcharts.com/docs/v5/getting-started/#Root_element
      var root = am5.Root.new("chartdiv");


      // Set themes
      // https://www.amcharts.com/docs/v5/concepts/themes/
      root.setThemes([
        am5themes_Animated.new(root)
      ]);


      // Build the chart from its JSON config
      // https://www.amcharts.com/docs/v5/concepts/serializing/
      am5plugins_json.JsonParser.new(root).parse(config, {
        parent: root.container
      });
    </script>
  </body>
</html>
