<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>amCharts 5 Example - Gauge with Clock Hand (JSON config)</title>

    <!-- Styles -->
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
        padding: 0;
        margin: 0;
        background-color: #ffffff;
      }

      #chartdiv {
        width: 100%;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="chartdiv"></div>

    <!-- Resources -->
    <script src="../../index.js"></script>
    <script src="../../xy.js"></script>
    <script src="../../radar.js"></script>
    <script src="../../themes/Animated.js"></script>
    <script src="../../plugins/json.js"></script>

    <!-- Chart code -->
    <script>
      // The chart as a JSON config. The code that builds the chart from it is below
      // how a config reads:
      // "type" is the class to create, and "settings" are what you would pass to its new() in code
      // "properties" fill in its parts: lists such as series and axes, or templates such as columns.template
      // "refs" holds objects used in more than one place: "#series-0" stands for the one named series-0
      // a string starting with "@" takes a value from another object, such as "@series.get('fill')"
      // https://www.amcharts.com/docs/v5/concepts/serializing/
      var config = {
        "type": "RadarChart",
        "settings": {
          "panX": false,
          "panY": false,
          "startAngle": 180,
          "endAngle": 360,
          "autoAppear": true,
          "appearDuration": 1000,
          "appearDelay": 100
        },
        "properties": {
          "xAxes": ["#axis-0"]
        },
        "refs": [
          {
            "axis-0": {
              "type": "ValueAxis",
              "settings": {
                "maxDeviation": 0,
                "min": 0,
                "max": 100,
                "strictMinMax": true,
                "renderer": {
                  "type": "AxisRendererCircular",
                  "settings": { "innerRadius": -10, "strokeOpacity": 0.1 }
                }
              }
            }
          },
          {
            "axisRange-0": {
              "axis": "#axis-0",
              "settings": {
                "value": 65,
                "bullet": {
                  "type": "AxisBullet",
                  "settings": {
                    "sprite": {
                      "type": "ClockHand",
                      "settings": {
                        "radius": { "type": "Percent", "value": 99 }
                      }
                    }
                  }
                },
                "grid": {
                  "type": "Grid",
                  "settings": { "visible": false }
                }
              },
              "__parseLogic": "axisRange"
            }
          }
        ]
      };


      // Create root element
      // https://www.amcharts.com/docs/v5/getting-started/#Root_element
      var root = am5.Root.new("chartdiv");


      // Set themes
      // https://www.amcharts.com/docs/v5/concepts/themes/
      root.setThemes([
        am5themes_Animated.new(root)
      ]);


      // Build the chart from its JSON config
      // https://www.amcharts.com/docs/v5/concepts/serializing/
      am5plugins_json.JsonParser.new(root).parse(config, {
        parent: root.container
      });
    </script>
  </body>
</html>
