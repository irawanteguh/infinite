<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>amCharts 5 Example - Globe with Raised Arcs (JSON config)</title>

    <!-- Styles -->
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
        padding: 0;
        margin: 0;
        background-color: #ffffff;
      }

      #chartdiv {
        width: 100%;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="chartdiv"></div>

    <!-- Resources -->
    <script src="../../index.js"></script>
    <script src="../../map.js"></script>
    <script src="../../geodata/worldLow.js"></script>
    <script src="../../themes/Animated.js"></script>
    <script src="../../plugins/json.js"></script>

    <!-- Chart code -->
    <script>
      // The chart as a JSON config. The code that builds the chart from it is below
      // how a config reads:
      // "type" is the class to create, and "settings" are what you would pass to its new() in code
      // "properties" fill in its parts: lists such as series and axes, or templates such as columns.template
      // "refs" holds objects used in more than one place: "#series-0" stands for the one named series-0
      // a string starting with "@" takes a value from another object, such as "@series.get('fill')"
      // https://www.amcharts.com/docs/v5/concepts/serializing/
      var config = {
        "type": "MapChart",
        "settings": {
          "panX": "rotateX",
          "panY": "rotateY",
          "rotationX": -20,
          "rotationY": -20,
          "autoAppear": true,
          "appearDuration": 1000,
          "appearDelay": 100,
          "projectionName": "geoOrthographic"
        },
        "properties": {
          "series": ["#series-0", "#series-1", "#series-2", "#series-3"]
        },
        "refs": [
          {
            "data-0": [
              {
                "geometry": { "type": "GeoRectangle", "north": 90, "east": 180, "south": -90, "west": -180 },
                "__parse": true
              }
            ]
          },
          {
            "data-1": []
          },
          {
            "data-2": [
              { "id": "london", "title": "London", "latitude": 51.5072, "longitude": -0.1276 },
              { "id": "new-york", "title": "New York", "latitude": 40.7128, "longitude": -74.006 },
              { "id": "sao-paulo", "title": "Sao Paulo", "latitude": -23.5505, "longitude": -46.6333 },
              { "id": "johannesburg", "title": "Johannesburg", "latitude": -26.2041, "longitude": 28.0473 },
              { "id": "singapore", "title": "Singapore", "latitude": 1.3521, "longitude": 103.8198 }
            ]
          },
          {
            "data-3": [
              {
                "pointIds": ["london", "new-york"],
                "__parse": true
              },
              {
                "pointIds": ["london", "singapore"],
                "__parse": true
              },
              {
                "pointIds": ["london", "johannesburg"],
                "__parse": true
              },
              {
                "pointIds": ["new-york", "sao-paulo"],
                "__parse": true
              },
              {
                "pointIds": ["sao-paulo", "johannesburg"],
                "__parse": true
              },
              {
                "pointIds": ["johannesburg", "singapore"],
                "__parse": true
              }
            ]
          },
          {
            "series-0": {
              "type": "MapPolygonSeries",
              "properties": {
                "data": "#data-0",
                "mapPolygons": {
                  "properties": {
                    "template": {
                      "settings": {
                        "fill": { "type": "Color", "value": "#000000" },
                        "fillOpacity": 0.06,
                        "strokeOpacity": 0
                      }
                    }
                  }
                }
              }
            }
          },
          {
            "series-1": {
              "type": "MapPolygonSeries",
              "settings": { "geoJSON": "am5geodata_worldLow" }
            }
          },
          {
            "series-2": {
              "type": "MapPointSeries",
              "settings": { "latitudeField": "latitude", "longitudeField": "longitude" },
              "properties": {
                "data": "#data-2",
                "bullets": [
                  {
                    "type": "Bullet",
                    "settings": {
                      "sprite": {
                        "type": "Circle",
                        "settings": {
                          "radius": 5,
                          "fill": { "type": "Color", "value": "#ff621f" },
                          "stroke": { "type": "Color", "value": "#ffffff" },
                          "strokeWidth": 2,
                          "tooltipText": "{title}"
                        }
                      }
                    }
                  }
                ]
              }
            }
          },
          {
            "series-3": {
              "type": "MapLineSeries",
              "settings": { "pointSeries": "#series-2" },
              "properties": {
                "data": "#data-3",
                "mapLines": {
                  "properties": {
                    "template": {
                      "settings": {
                        "altitude": 1000000,
                        "stroke": { "type": "Color", "value": "#ff621f" },
                        "strokeWidth": 2
                      }
                    }
                  }
                }
              }
            }
          }
        ]
      };


      // Create root element
      // https://www.amcharts.com/docs/v5/getting-started/#Root_element
      var root = am5.Root.new("chartdiv");


      // Set themes
      // https://www.amcharts.com/docs/v5/concepts/themes/
      root.setThemes([
        am5themes_Animated.new(root)
      ]);


      // Build the chart from its JSON config
      // https://www.amcharts.com/docs/v5/concepts/serializing/
      am5plugins_json.JsonParser.new(root).parse(config, {
        parent: root.container
      });
    </script>
  </body>
</html>
