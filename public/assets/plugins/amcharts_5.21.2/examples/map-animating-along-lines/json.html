<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>amCharts 5 Example - Animating Along Lines (JSON config)</title>

    <!-- Styles -->
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
        padding: 0;
        margin: 0;
        background-color: #ffffff;
      }

      #chartdiv {
        width: 100%;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="chartdiv"></div>

    <!-- Resources -->
    <script src="../../index.js"></script>
    <script src="../../map.js"></script>
    <script src="../../geodata/worldLow.js"></script>
    <script src="../../themes/Animated.js"></script>
    <script src="../../plugins/json.js"></script>

    <!-- Chart code -->
    <script>
      // The chart as a JSON config. The code that builds the chart from it is below
      // how a config reads:
      // "type" is the class to create, and "settings" are what you would pass to its new() in code
      // "properties" fill in its parts: lists such as series and axes, or templates such as columns.template
      // "refs" holds objects used in more than one place: "#series-0" stands for the one named series-0
      // a string starting with "@" takes a value from another object, such as "@series.get('fill')"
      // https://www.amcharts.com/docs/v5/concepts/serializing/
      var config = {
        "type": "MapChart",
        "settings": {
          "panX": "translateX",
          "panY": "translateY",
          "autoAppear": true,
          "appearDuration": 1000,
          "appearDelay": 100,
          "projectionName": "geoMercator"
        },
        "properties": {
          "series": ["#series-0", "#series-1", "#series-2", "#series-3"]
        },
        "refs": [
          {
            "data-0": []
          },
          {
            "data-1": [
              { "id": "los-angeles", "title": "Los Angeles", "longitude": -118.24, "latitude": 34.05 },
              { "id": "paris", "title": "Paris", "longitude": 2.35, "latitude": 48.86 }
            ]
          },
          {
            "data-2": [
              {
                "id": "route",
                "pointIds": ["los-angeles", "paris"],
                "__parse": true
              }
            ]
          },
          {
            "data-3": [
              { "lineId": "route", "positionOnLine": 0, "autoRotate": true }
            ]
          },
          {
            "series-0": {
              "type": "MapPolygonSeries",
              "settings": {
                "geoJSON": "am5geodata_worldLow",
                "exclude": ["AQ"]
              },
              "properties": {
                "mapPolygons": {
                  "properties": {
                    "template": {
                      "settings": {
                        "fill": { "type": "Color", "value": "#000000" },
                        "fillOpacity": 0.15
                      }
                    }
                  }
                }
              }
            }
          },
          {
            "series-1": {
              "type": "MapPointSeries",
              "properties": {
                "data": "#data-1",
                "bullets": [
                  {
                    "type": "Bullet",
                    "settings": {
                      "sprite": {
                        "type": "Circle",
                        "settings": {
                          "radius": 6,
                          "tooltipText": "{title}",
                          "tooltipY": 0,
                          "fill": { "type": "Color", "value": "#ffba00" },
                          "stroke": { "type": "Color", "value": "#ffffff" },
                          "strokeWidth": 2
                        }
                      }
                    }
                  }
                ]
              }
            }
          },
          {
            "series-2": {
              "type": "MapLineSeries",
              "settings": { "pointSeries": "#series-1" },
              "properties": {
                "data": "#data-2",
                "mapLines": {
                  "properties": {
                    "template": {
                      "settings": {
                        "stroke": { "type": "Color", "value": "#000000" },
                        "strokeOpacity": 0.4,
                        "strokeWidth": 2
                      }
                    }
                  }
                }
              }
            }
          },
          {
            "series-3": {
              "type": "MapPointSeries",
              "properties": {
                "data": "#data-3",
                "bullets": [
                  {
                    "type": "Bullet",
                    "settings": {
                      "sprite": {
                        "type": "Graphics",
                        "settings": {
                          "svgPath": "m2,106h28l24,30h72l-44,-133h35l80,132h98c21,0 21,34 0,34l-98,0 -80,134h-35l43,-133h-71l-24,30h-28l15,-47",
                          "scale": 0.06,
                          "centerX": { "type": "Percent", "value": 50 },
                          "centerY": { "type": "Percent", "value": 50 },
                          "fill": { "type": "Color", "value": "#000000" },
                          "animations": [
                            {
                              "key": "positionOnLine",
                              "from": 0,
                              "to": 1,
                              "duration": 10000,
                              "loops": 0,
                              "yoyo": true,
                              "target": "dataItem"
                            }
                          ]
                        }
                      }
                    }
                  }
                ]
              }
            }
          }
        ]
      };


      // Create root element
      // https://www.amcharts.com/docs/v5/getting-started/#Root_element
      var root = am5.Root.new("chartdiv");


      // Set themes
      // https://www.amcharts.com/docs/v5/concepts/themes/
      root.setThemes([
        am5themes_Animated.new(root)
      ]);


      // Build the chart from its JSON config
      // https://www.amcharts.com/docs/v5/concepts/serializing/
      am5plugins_json.JsonParser.new(root).parse(config, {
        parent: root.container
      });
    </script>
  </body>
</html>
