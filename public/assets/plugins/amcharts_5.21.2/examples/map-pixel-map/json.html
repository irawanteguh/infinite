<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>amCharts 5 Example - Pixel Map (JSON config)</title>

    <!-- Styles -->
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
        padding: 0;
        margin: 0;
        background-color: #ffffff;
      }

      #chartdiv {
        width: 100%;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="chartdiv"></div>

    <!-- Resources -->
    <script src="../../index.js"></script>
    <script src="../../map.js"></script>
    <script src="../../geodata/worldLow.js"></script>
    <script src="../../themes/Animated.js"></script>
    <script src="../../plugins/json.js"></script>

    <!-- Chart code -->
    <script>
      // The chart as a JSON config. The code that builds the chart from it is below
      // how a config reads:
      // "type" is the class to create, and "settings" are what you would pass to its new() in code
      // "properties" fill in its parts: lists such as series and axes, or templates such as columns.template
      // "refs" holds objects used in more than one place: "#series-0" stands for the one named series-0
      // a string starting with "@" takes a value from another object, such as "@series.get('fill')"
      // https://www.amcharts.com/docs/v5/concepts/serializing/
      var config = {
        "type": "MapChart",
        "settings": {
          "autoAppear": true,
          "appearDuration": 1000,
          "appearDelay": 100,
          "projectionName": "geoNaturalEarth1"
        },
        "properties": {
          "series": ["#series-0"]
        },
        "refs": [
          {
            "data-0": [
              { "id": "US", "value": 38, "__parse": true },
              { "id": "CA", "value": 41, "__parse": true },
              { "id": "MX", "value": 29, "__parse": true },
              { "id": "BR", "value": 33, "__parse": true },
              { "id": "AR", "value": 32, "__parse": true },
              { "id": "RU", "value": 39, "__parse": true },
              { "id": "KZ", "value": 31, "__parse": true },
              { "id": "CN", "value": 38, "__parse": true },
              { "id": "IN", "value": 28, "__parse": true },
              { "id": "ID", "value": 30, "__parse": true },
              { "id": "AU", "value": 38, "__parse": true },
              { "id": "EG", "value": 24, "__parse": true },
              { "id": "NG", "value": 18, "__parse": true },
              { "id": "ET", "value": 19, "__parse": true },
              { "id": "ZA", "value": 28, "__parse": true }
            ]
          },
          {
            "template-0": {
              "type": "Template",
              "settings": {
                "fill": { "type": "Color", "value": "#adadad" },
                "tooltipText": "{name}: {value}"
              }
            }
          },
          {
            "series-0": {
              "type": "PixelMapSeries",
              "settings": {
                "geoJSON": "am5geodata_worldLow",
                "exclude": ["AQ"],
                "pixelType": "circle",
                "step": 2,
                "uniform": true,
                "valueField": "value",
                "calculateAggregates": true,
                "heatRules": [
                  {
                    "target": "#template-0",
                    "dataField": "value",
                    "min": { "type": "Color", "value": "#ffd19a" },
                    "max": { "type": "Color", "value": "#b3261e" },
                    "key": "fill",
                    "__parse": true
                  }
                ]
              },
              "properties": {
                "data": "#data-0",
                "mapPolygons": {
                  "properties": { "template": "#template-0" }
                }
              }
            }
          }
        ]
      };


      // Create root element
      // https://www.amcharts.com/docs/v5/getting-started/#Root_element
      var root = am5.Root.new("chartdiv");


      // Set themes
      // https://www.amcharts.com/docs/v5/concepts/themes/
      root.setThemes([
        am5themes_Animated.new(root)
      ]);


      // Build the chart from its JSON config
      // https://www.amcharts.com/docs/v5/concepts/serializing/
      am5plugins_json.JsonParser.new(root).parse(config, {
        parent: root.container
      });
    </script>
  </body>
</html>
