<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>amCharts 5 Example - Satellite Image Globe (JSON config)</title>

    <!-- Styles -->
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
        padding: 0;
        margin: 0;
        background-color: #ffffff;
      }

      #chartdiv {
        width: 100%;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="chartdiv"></div>

    <!-- Resources -->
    <script src="../../index.js"></script>
    <script src="../../map.js"></script>
    <script src="../../geodata/worldLow.js"></script>
    <script src="../../themes/Animated.js"></script>
    <script src="../../plugins/json.js"></script>

    <!-- Chart code -->
    <script>
      // The chart as a JSON config. The code that builds the chart from it is below
      // how a config reads:
      // "type" is the class to create, and "settings" are what you would pass to its new() in code
      // "properties" fill in its parts: lists such as series and axes, or templates such as columns.template
      // "refs" holds objects used in more than one place: "#series-0" stands for the one named series-0
      // a string starting with "@" takes a value from another object, such as "@series.get('fill')"
      // https://www.amcharts.com/docs/v5/concepts/serializing/
      var config = {
        "type": "MapChart",
        "settings": {
          "panX": "rotateX",
          "panY": "rotateY",
          "animations": [
            { "key": "rotationX", "from": 0, "to": 360, "duration": 120000, "loops": 0 }
          ],
          "autoAppear": true,
          "appearDuration": 1000,
          "appearDelay": 100,
          "projectionName": "geoOrthographic"
        },
        "properties": {
          "series": ["#series-0", "#series-1"]
        },
        "children": [
          {
            "type": "Label",
            "settings": {
              "text": "Imagery: NASA Earth Observatory",
              "fontSize": 12,
              "x": { "type": "Percent", "value": 100 },
              "centerX": { "type": "Percent", "value": 100 },
              "y": { "type": "Percent", "value": 100 },
              "centerY": { "type": "Percent", "value": 100 }
            }
          }
        ],
        "refs": [
          {
            "data-0": []
          },
          {
            "data-1": []
          },
          {
            "series-0": {
              "type": "MapRasterSeries",
              "settings": { "src": "https://cdn.amcharts.com/lib/5/geodata/images/earthDay2048.jpg" }
            }
          },
          {
            "series-1": {
              "type": "MapPolygonSeries",
              "settings": { "geoJSON": "am5geodata_worldLow" },
              "properties": {
                "mapPolygons": {
                  "properties": {
                    "template": {
                      "settings": {
                        "fillOpacity": 0,
                        "stroke": { "type": "Color", "value": "#ffffff" },
                        "strokeWidth": 0.5,
                        "strokeOpacity": 0.6
                      }
                    }
                  }
                }
              }
            }
          }
        ]
      };


      // Create root element
      // https://www.amcharts.com/docs/v5/getting-started/#Root_element
      var root = am5.Root.new("chartdiv");


      // Set themes
      // https://www.amcharts.com/docs/v5/concepts/themes/
      root.setThemes([
        am5themes_Animated.new(root)
      ]);


      // Build the chart from its JSON config
      // https://www.amcharts.com/docs/v5/concepts/serializing/
      am5plugins_json.JsonParser.new(root).parse(config, {
        parent: root.container
      });
    </script>
  </body>
</html>
