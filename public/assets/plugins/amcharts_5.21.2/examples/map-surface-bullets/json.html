<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>amCharts 5 Example - Globe with Surface Bullets (JSON config)</title>

    <!-- Styles -->
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
        padding: 0;
        margin: 0;
        background-color: #ffffff;
      }

      #chartdiv {
        width: 100%;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="chartdiv"></div>

    <!-- Resources -->
    <script src="../../index.js"></script>
    <script src="../../map.js"></script>
    <script src="../../geodata/worldLow.js"></script>
    <script src="../../themes/Animated.js"></script>
    <script src="../../plugins/json.js"></script>

    <!-- Chart code -->
    <script>
      // The chart as a JSON config. The code that builds the chart from it is below
      // how a config reads:
      // "type" is the class to create, and "settings" are what you would pass to its new() in code
      // "properties" fill in its parts: lists such as series and axes, or templates such as columns.template
      // "refs" holds objects used in more than one place: "#series-0" stands for the one named series-0
      // a string starting with "@" takes a value from another object, such as "@series.get('fill')"
      // https://www.amcharts.com/docs/v5/concepts/serializing/
      var config = {
        "type": "MapChart",
        "settings": {
          "panX": "rotateX",
          "panY": "rotateY",
          "autoAppear": true,
          "appearDuration": 1000,
          "appearDelay": 100,
          "projectionName": "geoOrthographic"
        },
        "properties": {
          "series": ["#series-0", "#series-1", "#series-2"]
        },
        "refs": [
          {
            "data-0": [
              {
                "geometry": { "type": "GeoRectangle", "north": 90, "east": 180, "south": -90, "west": -180 },
                "__parse": true
              }
            ]
          },
          {
            "data-1": []
          },
          {
            "data-2": [
              { "title": "New York", "latitude": 40.7128, "longitude": -74.006 },
              { "title": "Mexico City", "latitude": 19.4326, "longitude": -99.1332 },
              { "title": "Sao Paulo", "latitude": -23.5505, "longitude": -46.6333 },
              { "title": "Reykjavik", "latitude": 64.1466, "longitude": -21.9426 },
              { "title": "London", "latitude": 51.5072, "longitude": -0.1276 },
              { "title": "Lagos", "latitude": 6.5244, "longitude": 3.3792 },
              { "title": "Cape Town", "latitude": -33.9249, "longitude": 18.4241 },
              { "title": "Cairo", "latitude": 30.0444, "longitude": 31.2357 },
              { "title": "Moscow", "latitude": 55.7558, "longitude": 37.6173 },
              { "title": "Delhi", "latitude": 28.6139, "longitude": 77.209 },
              { "title": "Tokyo", "latitude": 35.6895, "longitude": 139.6917 },
              { "title": "Sydney", "latitude": -33.8688, "longitude": 151.2093 }
            ]
          },
          {
            "series-0": {
              "type": "MapPolygonSeries",
              "properties": {
                "data": "#data-0",
                "mapPolygons": {
                  "properties": {
                    "template": {
                      "settings": {
                        "fill": { "type": "Color", "value": "#000000" },
                        "fillOpacity": 0.06,
                        "strokeOpacity": 0
                      }
                    }
                  }
                }
              }
            }
          },
          {
            "series-1": {
              "type": "MapPolygonSeries",
              "settings": { "geoJSON": "am5geodata_worldLow" }
            }
          },
          {
            "series-2": {
              "type": "MapPointSeries",
              "settings": { "surfaceBullets": true, "latitudeField": "latitude", "longitudeField": "longitude" },
              "properties": {
                "data": "#data-2",
                "bullets": [
                  {
                    "type": "Bullet",
                    "settings": {
                      "sprite": {
                        "type": "Graphics",
                        "settings": {
                          "svgPath": "M0,0 C-5,-7 -9,-11 -9,-17 A9,9 0 1 1 9,-17 C9,-11 5,-7 0,0 Z M0,-20.5 A3.5,3.5 0 1 0 0,-13.5 A3.5,3.5 0 1 0 0,-20.5 Z",
                          "fill": { "type": "Color", "value": "#ff621f" },
                          "stroke": { "type": "Color", "value": "#ffffff" },
                          "strokeWidth": 1,
                          "tooltipText": "{title}"
                        }
                      }
                    }
                  }
                ]
              }
            }
          }
        ]
      };


      // Create root element
      // https://www.amcharts.com/docs/v5/getting-started/#Root_element
      var root = am5.Root.new("chartdiv");


      // Set themes
      // https://www.amcharts.com/docs/v5/concepts/themes/
      root.setThemes([
        am5themes_Animated.new(root)
      ]);


      // Build the chart from its JSON config
      // https://www.amcharts.com/docs/v5/concepts/serializing/
      am5plugins_json.JsonParser.new(root).parse(config, {
        parent: root.container
      });
    </script>
  </body>
</html>
