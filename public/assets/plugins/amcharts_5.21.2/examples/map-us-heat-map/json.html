<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>amCharts 5 Example - US Heat Map (JSON config)</title>

    <!-- Styles -->
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
        padding: 0;
        margin: 0;
        background-color: #ffffff;
      }

      #chartdiv {
        width: 100%;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="chartdiv"></div>

    <!-- Resources -->
    <script src="../../index.js"></script>
    <script src="../../map.js"></script>
    <script src="../../geodata/usaLow.js"></script>
    <script src="../../themes/Animated.js"></script>
    <script src="../../plugins/json.js"></script>

    <!-- Chart code -->
    <script>
      // The chart as a JSON config. The code that builds the chart from it is below
      // how a config reads:
      // "type" is the class to create, and "settings" are what you would pass to its new() in code
      // "properties" fill in its parts: lists such as series and axes, or templates such as columns.template
      // "refs" holds objects used in more than one place: "#series-0" stands for the one named series-0
      // a string starting with "@" takes a value from another object, such as "@series.get('fill')"
      // https://www.amcharts.com/docs/v5/concepts/serializing/
      var config = {
        "type": "MapChart",
        "settings": {
          "paddingBottom": 60,
          "autoAppear": true,
          "appearDuration": 1000,
          "appearDelay": 100,
          "projectionName": "geoAlbersUsa"
        },
        "properties": {
          "series": ["#series-0"]
        },
        "children": [
          {
            "type": "HeatLegend",
            "settings": {
              "orientation": "horizontal",
              "colors": [
                "@root.interfaceColors.get('negative')",
                "@root.interfaceColors.get('warning')",
                "@root.interfaceColors.get('positive')"
              ],
              "startValue": 50,
              "endValue": 100,
              "width": { "type": "Percent", "value": 40 },
              "x": { "type": "Percent", "value": 50 },
              "centerX": { "type": "Percent", "value": 50 },
              "y": { "type": "Percent", "value": 100 },
              "paddingTop": 15
            }
          }
        ],
        "refs": [
          {
            "data-0": [
              { "id": "US-AL", "value": 61, "__parse": true },
              { "id": "US-AK", "value": 74, "__parse": true },
              { "id": "US-AZ", "value": 68, "__parse": true },
              { "id": "US-AR", "value": 57, "__parse": true },
              { "id": "US-CA", "value": 83, "__parse": true },
              { "id": "US-CO", "value": 88, "__parse": true },
              { "id": "US-CT", "value": 79, "__parse": true },
              { "id": "US-DE", "value": 71, "__parse": true },
              { "id": "US-DC", "value": 66, "__parse": true },
              { "id": "US-FL", "value": 72, "__parse": true },
              { "id": "US-GA", "value": 64, "__parse": true },
              { "id": "US-HI", "value": 90, "__parse": true },
              { "id": "US-ID", "value": 77, "__parse": true },
              { "id": "US-IL", "value": 69, "__parse": true },
              { "id": "US-IN", "value": 63, "__parse": true },
              { "id": "US-IA", "value": 81, "__parse": true },
              { "id": "US-KS", "value": 75, "__parse": true },
              { "id": "US-KY", "value": 58, "__parse": true },
              { "id": "US-LA", "value": 54, "__parse": true },
              { "id": "US-ME", "value": 86, "__parse": true },
              { "id": "US-MD", "value": 73, "__parse": true },
              { "id": "US-MA", "value": 89, "__parse": true },
              { "id": "US-MI", "value": 67, "__parse": true },
              { "id": "US-MN", "value": 92, "__parse": true },
              { "id": "US-MS", "value": 52, "__parse": true },
              { "id": "US-MO", "value": 65, "__parse": true },
              { "id": "US-MT", "value": 84, "__parse": true },
              { "id": "US-NE", "value": 80, "__parse": true },
              { "id": "US-NV", "value": 62, "__parse": true },
              { "id": "US-NH", "value": 91, "__parse": true },
              { "id": "US-NJ", "value": 76, "__parse": true },
              { "id": "US-NM", "value": 59, "__parse": true },
              { "id": "US-NY", "value": 78, "__parse": true },
              { "id": "US-NC", "value": 70, "__parse": true },
              { "id": "US-ND", "value": 82, "__parse": true },
              { "id": "US-OH", "value": 66, "__parse": true },
              { "id": "US-OK", "value": 56, "__parse": true },
              { "id": "US-OR", "value": 85, "__parse": true },
              { "id": "US-PA", "value": 72, "__parse": true },
              { "id": "US-RI", "value": 74, "__parse": true },
              { "id": "US-SC", "value": 60, "__parse": true },
              { "id": "US-SD", "value": 79, "__parse": true },
              { "id": "US-TN", "value": 63, "__parse": true },
              { "id": "US-TX", "value": 69, "__parse": true },
              { "id": "US-UT", "value": 87, "__parse": true },
              { "id": "US-VT", "value": 94, "__parse": true },
              { "id": "US-VA", "value": 77, "__parse": true },
              { "id": "US-WA", "value": 88, "__parse": true },
              { "id": "US-WV", "value": 53, "__parse": true },
              { "id": "US-WI", "value": 81, "__parse": true },
              { "id": "US-WY", "value": 76, "__parse": true }
            ]
          },
          {
            "template-0": {
              "type": "Template",
              "settings": {
                "tooltipText": "{name}: {value}",
                "stroke": "@root.interfaceColors.get('background')",
                "strokeWidth": 1
              }
            }
          },
          {
            "series-0": {
              "type": "MapPolygonSeries",
              "settings": {
                "geoJSON": "am5geodata_usaLow",
                "valueField": "value",
                "heatRules": [
                  {
                    "target": "#template-0",
                    "dataField": "value",
                    "key": "fill",
                    "stops": [
                      "@root.interfaceColors.get('negative')",
                      "@root.interfaceColors.get('warning')",
                      "@root.interfaceColors.get('positive')"
                    ],
                    "minValue": 50,
                    "maxValue": 100,
                    "__parse": true
                  }
                ]
              },
              "properties": {
                "data": "#data-0",
                "mapPolygons": {
                  "properties": { "template": "#template-0" }
                }
              }
            }
          }
        ]
      };


      // Create root element
      // https://www.amcharts.com/docs/v5/getting-started/#Root_element
      var root = am5.Root.new("chartdiv");


      // Set themes
      // https://www.amcharts.com/docs/v5/concepts/themes/
      root.setThemes([
        am5themes_Animated.new(root)
      ]);


      // Build the chart from its JSON config
      // https://www.amcharts.com/docs/v5/concepts/serializing/
      am5plugins_json.JsonParser.new(root).parse(config, {
        parent: root.container
      });
    </script>
  </body>
</html>
