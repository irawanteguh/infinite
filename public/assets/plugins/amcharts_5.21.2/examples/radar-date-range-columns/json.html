<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>amCharts 5 Example - Radar Date Range Columns (JSON config)</title>

    <!-- Styles -->
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
        padding: 0;
        margin: 0;
        background-color: #ffffff;
      }

      #chartdiv {
        width: 100%;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="chartdiv"></div>

    <!-- Resources -->
    <script src="../../index.js"></script>
    <script src="../../xy.js"></script>
    <script src="../../radar.js"></script>
    <script src="../../themes/Animated.js"></script>
    <script src="../../plugins/json.js"></script>

    <!-- Chart code -->
    <script>
      // The chart as a JSON config. The code that builds the chart from it is below
      // how a config reads:
      // "type" is the class to create, and "settings" are what you would pass to its new() in code
      // "properties" fill in its parts: lists such as series and axes, or templates such as columns.template
      // "refs" holds objects used in more than one place: "#series-0" stands for the one named series-0
      // a string starting with "@" takes a value from another object, such as "@series.get('fill')"
      // https://www.amcharts.com/docs/v5/concepts/serializing/
      var config = {
        "type": "RadarChart",
        "settings": {
          "innerRadius": { "type": "Percent", "value": 30 },
          "autoAppear": true,
          "appearDuration": 1000,
          "appearDelay": 100
        },
        "properties": {
          "series": ["#series-0"],
          "xAxes": ["#axis-0"],
          "yAxes": ["#axis-1"]
        },
        "refs": [
          {
            "data-0": [
              { "produce": "Leeks", "start": 1757883600000, "end": 1767132000000 },
              { "produce": "Apples", "start": 1755205200000, "end": 1763157600000 },
              { "produce": "Tomatoes", "start": 1751317200000, "end": 1760043600000 },
              { "produce": "Strawberries", "start": 1747688400000, "end": 1752958800000 },
              { "produce": "Asparagus", "start": 1744664400000, "end": 1750366800000 },
              { "produce": "Spinach", "start": 1740780000000, "end": 1748638800000 },
              { "produce": "Spinach", "start": 1756674000000, "end": 1762725600000 }
            ]
          },
          {
            "data-1": [
              { "produce": "Leeks" },
              { "produce": "Apples" },
              { "produce": "Tomatoes" },
              { "produce": "Strawberries" },
              { "produce": "Asparagus" },
              { "produce": "Spinach" }
            ]
          },
          {
            "axis-0": {
              "type": "DateAxis",
              "settings": {
                "min": 1735682400000,
                "max": 1767218400000,
                "baseInterval": { "timeUnit": "day", "count": 1 },
                "renderer": { "type": "AxisRendererCircular" }
              }
            }
          },
          {
            "axis-1": {
              "type": "CategoryAxis",
              "settings": {
                "categoryField": "produce",
                "renderer": {
                  "type": "AxisRendererRadial",
                  "settings": { "minGridDistance": 20 }
                }
              },
              "properties": { "data": "#data-1" }
            }
          },
          {
            "series-0": {
              "type": "RadarColumnSeries",
              "settings": {
                "name": "In season",
                "xAxis": "#axis-0",
                "yAxis": "#axis-1",
                "categoryYField": "produce",
                "openValueXField": "start",
                "valueXField": "end",
                "autoAppear": true,
                "appearDuration": 1000
              },
              "properties": {
                "data": "#data-0",
                "columns": {
                  "properties": {
                    "template": {
                      "settings": { "cornerRadius": 25, "tooltipText": "{categoryY}: {openValueX} - {valueX}" }
                    }
                  }
                }
              }
            }
          }
        ],
        "root": {
          "properties": {
            "dateFormatter": {
              "settings": {
                "dateFormat": "MMM d",
                "dateFields": ["valueX", "openValueX"]
              }
            }
          }
        }
      };


      // Create root element
      // https://www.amcharts.com/docs/v5/getting-started/#Root_element
      var root = am5.Root.new("chartdiv");


      // Set themes
      // https://www.amcharts.com/docs/v5/concepts/themes/
      root.setThemes([
        am5themes_Animated.new(root)
      ]);


      // Build the chart from its JSON config
      // https://www.amcharts.com/docs/v5/concepts/serializing/
      am5plugins_json.JsonParser.new(root).parse(config, {
        parent: root.container
      });
    </script>
  </body>
</html>
