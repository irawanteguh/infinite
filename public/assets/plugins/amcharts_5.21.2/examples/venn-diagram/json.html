<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>amCharts 5 Example - Venn Diagram (JSON config)</title>

    <!-- Styles -->
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
        padding: 0;
        margin: 0;
        background-color: #ffffff;
      }

      #chartdiv {
        width: 100%;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="chartdiv"></div>

    <!-- Resources -->
    <script src="../../index.js"></script>
    <script src="../../venn.js"></script>
    <script src="../../themes/Animated.js"></script>
    <script src="../../plugins/json.js"></script>

    <!-- Chart code -->
    <script>
      // The chart as a JSON config. The code that builds the chart from it is below
      // how a config reads:
      // "type" is the class to create, and "settings" are what you would pass to its new() in code
      // "properties" fill in its parts: lists such as series and axes, or templates such as columns.template
      // "refs" holds objects used in more than one place: "#series-0" stands for the one named series-0
      // a string starting with "@" takes a value from another object, such as "@series.get('fill')"
      // https://www.amcharts.com/docs/v5/concepts/serializing/
      var config = {
        "type": "Container",
        "settings": {
          "width": { "type": "Percent", "value": 100 },
          "height": { "type": "Percent", "value": 100 },
          "layout": { "type": "VerticalLayout" }
        },
        "children": [
          "#series-0",
          {
            "type": "Legend",
            "settings": {
              "centerX": { "type": "Percent", "value": 50 },
              "x": { "type": "Percent", "value": 50 }
            },
            "properties": { "data": "#series-0.dataItems" }
          }
        ],
        "refs": [
          {
            "data-0": [
              { "name": "A", "value": 10 },
              { "name": "B", "value": 10 },
              { "name": "C", "value": 5 },
              {
                "name": "X",
                "value": 4,
                "sets": ["A", "B"],
                "__parse": true
              },
              {
                "name": "Y",
                "value": 2,
                "sets": ["A", "C"],
                "__parse": true
              },
              {
                "name": "Z",
                "value": 2,
                "sets": ["B", "C"],
                "__parse": true
              },
              {
                "name": "Q",
                "value": 1,
                "sets": ["A", "B", "C"],
                "__parse": true
              }
            ]
          },
          {
            "series-0": {
              "type": "Venn",
              "settings": {
                "categoryField": "name",
                "valueField": "value",
                "intersectionsField": "sets",
                "paddingTop": 40,
                "paddingBottom": 40,
                "paddingLeft": 40,
                "paddingRight": 40,
                "autoAppear": true,
                "appearDuration": 1000,
                "appearDelay": 100
              },
              "properties": {
                "data": "#data-0",
                "slices": {
                  "properties": {
                    "template": {
                      "settings": { "tooltipText": "{category}: {value}" }
                    }
                  }
                }
              }
            }
          }
        ]
      };


      // Create root element
      // https://www.amcharts.com/docs/v5/getting-started/#Root_element
      var root = am5.Root.new("chartdiv");


      // Set themes
      // https://www.amcharts.com/docs/v5/concepts/themes/
      root.setThemes([
        am5themes_Animated.new(root)
      ]);


      // Build the chart from its JSON config
      // https://www.amcharts.com/docs/v5/concepts/serializing/
      am5plugins_json.JsonParser.new(root).parse(config, {
        parent: root.container
      });
    </script>
  </body>
</html>
