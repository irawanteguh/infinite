<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>amCharts 5 Examples</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f7f9;
        --card: #ffffff;
        --text: #1c2330;
        --muted: #5d6878;
        --line: #dfe3ea;
        --accent: #2f6fde;
        --on-accent: #ffffff;
        --code-bg: #fbfcfd;
        --tok-comment: #6b7a8c;
        --tok-string: #0b7a4b;
        --tok-number: #a24a00;
        --tok-keyword: #8a2fb8;
        --tok-name: #1d5fc4;
        --added: #e2f3e6;
        --warn: #c98a00;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #12161d;
          --card: #1b212b;
          --text: #e8ecf2;
          --muted: #9aa5b5;
          --line: #2c3442;
          --accent: #7aa7ff;
          --on-accent: #0d1320;
          --code-bg: #161b24;
          --tok-comment: #8794a6;
          --tok-string: #7fd4a4;
          --tok-number: #f0a868;
          --tok-keyword: #d19cf0;
          --tok-name: #8ab8ff;
          --added: #1d3a2a;
          --warn: #e0a83a;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      a { color: var(--accent); text-decoration: none; }
      a:hover, a:focus-visible { text-decoration: underline; }
      button, select {
        font: inherit;
        color: var(--text);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 5px 10px;
      }
      button { cursor: pointer; }
      button:focus-visible, select:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

      /* What the example is, and moving between examples */
      header {
        flex: 0 0 auto;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 14px;
        padding: 10px 16px;
        border-bottom: 1px solid var(--line);
        background: var(--card);
      }
      header .about { flex: 1 1 320px; min-width: 0; }
      header h1 { margin: 0; font-size: 18px; line-height: 1.3; }
      header h1 small { margin-left: 8px; color: var(--muted); font-weight: normal; font-size: 13px; }
      header p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
      header nav { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
      header select { max-width: 280px; }

      /* The running chart; the strip under it is dragged to resize it */
      .chart {
        flex: 0 0 auto;
        position: relative;
        height: 44vh;
        height: min(44vh, 520px);
        min-height: 180px;
        max-height: 80vh;
        overflow: hidden;
        background: #ffffff;
      }
      .chart iframe { display: block; width: 100%; height: 100%; border: 0; }
      .grip {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 11px;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        background: var(--card);
        cursor: ns-resize;
        touch-action: none;
      }
      .grip::before { content: ""; width: 40px; height: 3px; border-radius: 2px; background: var(--muted); opacity: 0.6; }
      .grip:hover::before, .grip:focus-visible::before, .resizing .grip::before { background: var(--accent); opacity: 1; }
      .grip:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
      /* While dragging, the frame must not take the pointer */
      .resizing { cursor: ns-resize; user-select: none; -webkit-user-select: none; }
      .resizing iframe { pointer-events: none; }

      .bar {
        flex: 0 0 auto;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 14px;
        padding: 8px 16px;
        border-bottom: 1px solid var(--line);
        background: var(--card);
      }
      .bar .label { color: var(--muted); font-size: 13px; }
      .segmented { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
      [hidden] { display: none !important; }
      .segmented button { border: 0; border-radius: 0; background: transparent; }
      .segmented button + button { border-left: 1px solid var(--line); }
      /* The group clips an outline around its buttons: drawn inside instead */
      .segmented button:focus-visible { outline-offset: -3px; }
      .segmented button[aria-pressed="true"], .tabs button[aria-pressed="true"] {
        background: var(--accent);
        color: var(--on-accent);
      }
      .tabs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
      .tabs button[aria-pressed="true"] { border-color: var(--accent); }
      .spacer { flex: 1 1 auto; }
      .note { color: var(--muted); font-size: 13px; }
      #modeNote { flex: 1 1 240px; min-width: 0; }
      /* A JSON version that is not the same chart says so where it is seen */
      #modeNote.differs { color: var(--text); border-left: 3px solid var(--warn); padding-left: 8px; }
      #copy { min-width: 5.5em; }
      .check { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; }

      /* The source */
      /* Takes what is left and scrolls on its own, so the chart stays in view */
      .source { flex: 1 1 0; min-height: 0; overflow: auto; background: var(--code-bg); }
      pre {
        margin: 0;
        padding: 14px 16px 32px;
        font: 13px/1.55 ui-monospace, "Cascadia Mono", Consolas, "SF Mono", Menlo, monospace;
        tab-size: 2;
        white-space: pre;
      }
      .c { color: var(--tok-comment); }
      .s { color: var(--tok-string); }
      .n { color: var(--tok-number); }
      .k { color: var(--tok-keyword); }
      .t { color: var(--tok-name); }
      /* Lines the viewer added to the source */
      .added { display: block; margin: 0 -16px; padding: 0 16px; background: var(--added); }
      /* Rows of long data that are left out until asked for */
      .fold { display: block; margin: 0 -16px; padding: 0 16px; color: var(--accent); cursor: pointer; }
      .fold:hover, .fold:focus-visible { text-decoration: underline; }
      .fold:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

      @media (max-width: 600px), (max-height: 800px) {
        .chart { height: 36vh; }
      }
      @media (max-width: 600px), (max-height: 640px) {
        header p { display: none; }
      }
      @media (max-width: 600px) {
        #fileNote { display: none; }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="about">
        <h1><span id="title">amCharts 5 Examples</span><small id="kind"></small></h1>
        <p id="description"></p>
      </div>
      <nav aria-label="Examples">
        <a href="index.html">All examples</a>
        <button type="button" id="previous" aria-label="Previous example">&lsaquo; Previous</button>
        <select id="picker" aria-label="Example"></select>
        <button type="button" id="next" aria-label="Next example">Next &rsaquo;</button>
      </nav>
    </header>

    <div class="chart" id="chart"></div>
    <div class="grip" id="grip" role="separator" aria-orientation="horizontal" aria-label="Resize the chart" tabindex="0" title="Drag to resize the chart; double-click for the usual size"></div>

    <div class="bar">
      <span class="label" id="modeLabel">Chart built from</span>
      <div class="segmented" id="mode" role="group" aria-labelledby="modeLabel">
        <button type="button" data-mode="code" aria-pressed="true">JavaScript</button>
        <button type="button" data-mode="json" aria-pressed="false">JSON config</button>
      </div>
      <span class="note" id="modeNote"></span>
      <label class="check" id="svgLabel"><input type="checkbox" id="svg" /> SVG renderer</label>
    </div>

    <div class="bar">
      <div class="tabs" id="tabs" role="group" aria-label="Source files"></div>
      <span class="spacer"></span>
      <span class="note" id="fileNote"></span>
      <button type="button" id="copy" aria-live="polite">Copy</button>
    </div>

    <div class="source" id="source" role="region" aria-label="Source" tabindex="0"><pre id="code"></pre></div>

    <script>
    (function () {
      // Filled in by the build: every example, in gallery order
      var EXAMPLES = [{"name":"xy-100-percent-stacked-column","title":"100% Stacked Column Chart","description":"Stacked columns shown as shares of each category's total, using valueYShow and calculateTotals.","categoryTitle":"XY","tierTitle":"Basic","json":true,"svg":false},{"name":"xy-bubble","title":"Bubble Chart","description":"Countries as bubbles on two value axes, sized by a heat rule and colored per data row through templateField.","categoryTitle":"XY","tierTitle":"Basic","json":true,"svg":false},{"name":"xy-candlestick","title":"Candlestick Chart","description":"Daily open, high, low and close prices as candles on a date axis; OHLCSeries takes the same settings.","categoryTitle":"XY","tierTitle":"Basic","json":true,"svg":false},{"name":"xy-clustered-column","title":"Clustered Column Chart","description":"Several column series side by side in each category, with value labels and a legend.","categoryTitle":"XY","tierTitle":"Basic","json":true,"svg":false},{"name":"xy-column","title":"Column Chart with Date Axis","description":"A column series of daily values on a date axis, with a cursor, a scrollbar and zoom.","categoryTitle":"XY","tierTitle":"Basic","json":true,"svg":false},{"name":"xy-dumbbell-plot","title":"Dumbbell Plot","description":"A range per category drawn as a thin column from the open value to the close value, with a bullet at each end.","categoryTitle":"XY","tierTitle":"Basic","json":true,"svg":false},{"name":"xy-gapless-date-axis","title":"Gapless Date Axis","description":"A line of weekday values on a GaplessDateAxis, which leaves out the weekends so the points stay evenly spaced.","categoryTitle":"XY","tierTitle":"Basic","json":true,"svg":false},{"name":"xy-line","title":"Line Chart with Date Axis","description":"A line series on a date axis, with a cursor, a scrollbar and zoom.","categoryTitle":"XY","tierTitle":"Basic","json":true,"svg":false},{"name":"xy-smoothed-line","title":"Smoothed Line Chart","description":"A smoothed line series with a fill and bullets on a date axis.","categoryTitle":"XY","tierTitle":"Basic","json":true,"svg":false},{"name":"xy-stacked-and-clustered-column","title":"Stacked and Clustered Columns","description":"Column series where some are stacked and some start a new cluster, set per series with the stacked setting.","categoryTitle":"XY","tierTitle":"Basic","json":true,"svg":false},{"name":"xy-stacked-column","title":"Stacked Column Chart","description":"Six column series stacked on a category axis, with value labels and a legend.","categoryTitle":"XY","tierTitle":"Basic","json":true,"svg":false},{"name":"xy-stacked-step","title":"Stacked Step Line Chart","description":"Two step line series with fills, one stacked on the other, on a date axis.","categoryTitle":"XY","tierTitle":"Basic","json":true,"svg":false},{"name":"xy-comparing-periods","title":"Comparing Two Periods","description":"This period as a solid line and the previous one as a dashed line on the same dates, with one tooltip showing both values.","categoryTitle":"XY","tierTitle":"Technique","json":true,"svg":false},{"name":"xy-data-grouping","title":"Data Grouping on a Date Axis","description":"A line of 50,000 hourly values that stays responsive because the date axis groups them into longer periods with groupData.","categoryTitle":"XY","tierTitle":"Technique","json":false,"svg":false},{"name":"xy-draggable-range","title":"Draggable Range","description":"A handle on the date axis that the user drags to move an axis range; the part of the series after it is drawn in another color with a pattern fill.","categoryTitle":"XY","tierTitle":"Technique","json":false,"svg":false},{"name":"xy-drawing-series","title":"Drawing a Series","description":"Clicking the plot area adds a point to a line series and its bullets can be dragged, by turning pointer coordinates into axis values.","categoryTitle":"XY","tierTitle":"Technique","json":false,"svg":false},{"name":"xy-line-highlight-on-legend-hover","title":"Highlight Line on Legend Hover","description":"Ten line series with a legend at the side; hovering a legend item dims all the other lines, done with events on the legend item template.","categoryTitle":"XY","tierTitle":"Technique","json":false,"svg":false},{"name":"xy-live-data","title":"Live Data","description":"A line that gets a new point every second and drops its oldest one, with the new point animated in from the last.","categoryTitle":"XY","tierTitle":"Technique","json":false,"svg":false},{"name":"xy-multiple-synced-value-axes","title":"Multiple Synced Value Axes","description":"Three line series with a value axis each, colored like their series, with the grids lined up by syncWithAxis.","categoryTitle":"XY","tierTitle":"Technique","json":true,"svg":false},{"name":"xy-percent-change-comparison","title":"Percent Change Comparison","description":"Two price series shown as percent change from the start of the zoomed range, so they can be compared, with a volume panel on a second, stacked Y axis.","categoryTitle":"XY","tierTitle":"Technique","json":true,"svg":false},{"name":"xy-pulsing-last-bullet","title":"Pulsing Last Bullet","description":"A line whose last point has a pulsing bullet, switched on for one data item with templateField and animated with the animations setting.","categoryTitle":"XY","tierTitle":"Technique","json":true,"svg":false},{"name":"xy-real-time-data-sorting","title":"Real-Time Data Sorting","description":"Columns whose values change on a timer and that slide to their new places as the category axis is sorted again.","categoryTitle":"XY","tierTitle":"Technique","json":false,"svg":false},{"name":"pie-donut-chart","title":"Donut Chart","description":"A pie chart made into a donut with an inner radius, with a legend below it.","categoryTitle":"Pie and sliced","tierTitle":"Basic","json":true,"svg":false},{"name":"sliced-funnel","title":"Funnel Chart","description":"A funnel series in a sliced chart, with labels on the slices and a legend.","categoryTitle":"Pie and sliced","tierTitle":"Basic","json":true,"svg":false},{"name":"sliced-pictorial-stacked","title":"Pictorial Stacked Chart","description":"A pictorial stacked series: slices fill an SVG shape in proportion to their values.","categoryTitle":"Pie and sliced","tierTitle":"Basic","json":true,"svg":false},{"name":"pie-chart","title":"Pie Chart","description":"A pie chart with a legend below it.","categoryTitle":"Pie and sliced","tierTitle":"Basic","json":true,"svg":false},{"name":"sliced-pyramid","title":"Pyramid Chart","description":"A pyramid series in a sliced chart, with aligned labels and a legend.","categoryTitle":"Pie and sliced","tierTitle":"Basic","json":true,"svg":false},{"name":"pie-variable-radius","title":"Pie Chart with Variable Radius","description":"A pie chart where each slice's radius follows its value, set by an adapter on the slice template.","categoryTitle":"Pie and sliced","tierTitle":"Technique","json":false,"svg":false},{"name":"map-day-and-night","title":"Day and Night Map","description":"A world map with a NightSeries that shades where it is night right now and shows the sun.","categoryTitle":"Map","tierTitle":"Basic","json":true,"svg":false},{"name":"map-globe-with-projected-circles","title":"Globe with Projected Circles","description":"Population by country as circles that lie on the surface of a globe and flatten towards its edge, sized by a heat rule, with surfaceBullets.","categoryTitle":"Map","tierTitle":"Basic","json":true,"svg":false},{"name":"map-altitude-arcs","title":"Globe with Raised Arcs","description":"Flight routes between cities on a globe, drawn as lines that rise above the surface in an arc with the altitude setting.","categoryTitle":"Map","tierTitle":"Basic","json":true,"svg":false},{"name":"map-surface-bullets","title":"Globe with Surface Bullets","description":"City pins that lie on the surface of a globe and flatten towards its edge, using the surfaceBullets setting of MapPointSeries.","categoryTitle":"Map","tierTitle":"Basic","json":true,"svg":false},{"name":"map-sankey","title":"Map Sankey","description":"Flows between countries drawn as bands on a map with MapSankeySeries, each band as wide as its value.","categoryTitle":"Map","tierTitle":"Basic","json":true,"svg":false},{"name":"map-with-bubbles","title":"Map with Bubbles","description":"Bubbles placed on countries by their id, with heat rules setting each bubble's size and color from its value.","categoryTitle":"Map","tierTitle":"Basic","json":true,"svg":false},{"name":"map-auto-home","title":"Map with Home Position","description":"A map that opens zoomed in on Europe, using the home settings and autoHome, with a home button to return there.","categoryTitle":"Map","tierTitle":"Basic","json":true,"svg":false},{"name":"map-pixel-map","title":"Pixel Map","description":"A world map drawn as a grid of dots with PixelMapSeries, with countries colored by value using heat rules.","categoryTitle":"Map","tierTitle":"Basic","json":true,"svg":false},{"name":"map-satellite-day-and-night","title":"Satellite Day and Night Map","description":"A flat map that shows a daytime satellite image where the sun is up right now and city lights where it is night, with MapRasterSeries. The images load from the amCharts CDN, so it needs an internet connection.","categoryTitle":"Map","tierTitle":"Basic","json":true,"svg":false},{"name":"map-satellite-globe","title":"Satellite Image Globe","description":"A slowly turning globe that shows a satellite image with MapRasterSeries, with country borders drawn over it. The image loads from the amCharts CDN, so it needs an internet connection.","categoryTitle":"Map","tierTitle":"Basic","json":true,"svg":false},{"name":"map-us-heat-map","title":"US Heat Map","description":"US states colored by value on a red, yellow and green scale, with heat rules and a heat legend that take several colors.","categoryTitle":"Map","tierTitle":"Basic","json":true,"svg":false},{"name":"map-animating-along-lines","title":"Animating Along Lines","description":"A plane flies back and forth along a line between two cities, moved by the animations setting of its bullet.","categoryTitle":"Map","tierTitle":"Technique","json":true,"svg":false},{"name":"map-clustered-points","title":"Clustered Map Points","description":"City markers that merge into clusters with a count when they are close together; clicking a cluster zooms in on its cities.","categoryTitle":"Map","tierTitle":"Technique","json":true,"jsonNote":"Zooming in on a clicked cluster takes code.","svg":false},{"name":"map-globe-rotate-to-country","title":"Globe Rotating to a Country","description":"A globe that turns and zooms to the clicked country, and back when it is clicked again or the water is clicked: clickZoom on a map that pans by rotating.","categoryTitle":"Map","tierTitle":"Technique","json":true,"svg":false},{"name":"map-zoom-to-country","title":"Zoom to Country","description":"Click a country to zoom in on it; click it again, the water or the home button to zoom back out. One setting, clickZoom, does it.","categoryTitle":"Map","tierTitle":"Technique","json":true,"svg":false},{"name":"map-sankey-waypoints","title":"Map Sankey with Waypoints","description":"Oil routes on a globe: MapSankeySeries flows between coordinates, bent through waypoints to stay at sea, with a bullet travelling along each one.","categoryTitle":"Map","tierTitle":"Showcase","json":true,"jsonNote":"Giving every drop the same speed and its own start takes code, so here they all take the same time.","svg":false},{"name":"stock-chart-comparing-stocks","title":"Comparing Stocks","description":"A stock chart with a comparison control and a searchable dropdown: picked stocks are added with addComparingSeries() and the chart switches to percent change.","categoryTitle":"Stock","tierTitle":"Technique","json":false,"svg":false},{"name":"stock-chart-live","title":"Live Stock Chart","description":"A candlestick chart that gets a new price every second: the last candle is updated or a new one is added, and an axis range follows the current value.","categoryTitle":"Stock","tierTitle":"Technique","json":false,"svg":false},{"name":"stock-chart-data-granularity","title":"Stock Chart Data Granularity","description":"A stock chart with an interval control that swaps minute, day, week and month data and sets the matching base interval on the date axis.","categoryTitle":"Stock","tierTitle":"Technique","json":false,"svg":false},{"name":"stock-chart-data-grouping","title":"Stock Chart Data Grouping","description":"Three years of daily prices on a date axis with groupData, which shows them as weekly candlesticks when zoomed out and as daily ones when zoomed in.","categoryTitle":"Stock","tierTitle":"Technique","json":false,"svg":false},{"name":"stock-chart-volume-separate-panel","title":"Stock Chart with Volume Panel","description":"A stock chart that shows volume in a second panel, which has its own axes, legend and cursor and stays in sync with the main one.","categoryTitle":"Stock","tierTitle":"Technique","json":false,"svg":false},{"name":"stock-chart","title":"Stock Chart","description":"A stock chart with candlesticks, volume, a scrollbar with a preview, a legend and a toolbar for indicators, periods, series type and drawing.","categoryTitle":"Stock","tierTitle":"Showcase","json":false,"svg":false},{"name":"hierarchy-pack","title":"Circle Pack","description":"A pack chart: nested data as circles inside circles, sized by value, where a click opens the next level.","categoryTitle":"Hierarchy","tierTitle":"Basic","json":true,"svg":false},{"name":"hierarchy-force-directed","title":"Force-Directed Tree","description":"A force-directed tree: nested data as linked circles that arrange themselves and open on click.","categoryTitle":"Hierarchy","tierTitle":"Basic","json":true,"svg":false},{"name":"hierarchy-partition","title":"Partition Chart","description":"A partition chart: every level of nested data as a column of rectangles sized by value.","categoryTitle":"Hierarchy","tierTitle":"Basic","json":true,"svg":false},{"name":"hierarchy-sunburst","title":"Sunburst Chart","description":"A sunburst: nested data as rings of slices, one ring per level.","categoryTitle":"Hierarchy","tierTitle":"Basic","json":true,"svg":false},{"name":"hierarchy-tree","title":"Tree Chart","description":"A tree chart: nested data as linked nodes laid out level by level.","categoryTitle":"Hierarchy","tierTitle":"Basic","json":true,"svg":false},{"name":"hierarchy-treemap","title":"Treemap with Breadcrumbs","description":"A treemap that drills into a branch on click, with a breadcrumb bar to go back up.","categoryTitle":"Hierarchy","tierTitle":"Basic","json":true,"svg":false},{"name":"hierarchy-voronoi-treemap","title":"Voronoi Treemap","description":"World population as a Voronoi treemap, with theme rules that style each level and a click that zooms to a continent.","categoryTitle":"Hierarchy","tierTitle":"Showcase","json":true,"jsonNote":"Styling by level, names where they fit and the zoom on click take code, so this one shows country codes.","svg":false},{"name":"flow-arc-diagram","title":"Arc Diagram","description":"An arc diagram: nodes in a row, sized by their total, with arcs for the links between them and a label under each node.","categoryTitle":"Flow","tierTitle":"Basic","json":true,"svg":false},{"name":"flow-chord","title":"Chord Diagram","description":"A chord diagram where ribbons between the nodes show how much flows each way.","categoryTitle":"Flow","tierTitle":"Basic","json":true,"svg":false},{"name":"flow-chord-directed","title":"Directed Chord Diagram","description":"A chord diagram whose links end in arrowheads, so each one shows its direction.","categoryTitle":"Flow","tierTitle":"Basic","json":true,"svg":false},{"name":"flow-sankey","title":"Sankey Diagram","description":"A Sankey diagram: nodes in columns and links whose width shows how much flows between them.","categoryTitle":"Flow","tierTitle":"Basic","json":true,"svg":f           setHeight(chart.getBoundingClientRect().height + (event.key === "ArrowDown" ? 24 : -24), true);
          event.preventDefault();
        }
      });
      grip.addEventListener("dblclick", function () {
        chart.style.height = "";
        try { localStorage.removeItem("am5examples-height"); } catch (e) {}
      });
      svgBox.addEventListener("change", function () {
        reveal = svgBox.checked;
        go(current.index, current.json, svgBox.checked);
      });

      document.getElementById("copy").addEventListener("click", function () {
        var button = this;
        var text = copyText;
        var done = function () {
          button.textContent = "Copied";
          setTimeout(function () { button.textContent = "Copy"; }, 1500);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(done, function () {});
        }
        else {
          var area = document.createElement("textarea");
          area.value = text;
          document.body.appendChild(area);
          area.select();
          try { document.execCommand("copy"); done(); } catch (e) {}
          document.body.removeChild(area);
        }
      });

      window.addEventListener("hashchange", show);

      if (EXAMPLES.length) {
        show();
      }
      else {
        document.getElementById("description").textContent = "No examples found.";
      }
    })();
    </script>
  </body>
</html>
