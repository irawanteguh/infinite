<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>amCharts 5 Example - Word Cloud from Text (JSON config)</title>

    <!-- Styles -->
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
        padding: 0;
        margin: 0;
        background-color: #ffffff;
      }

      #chartdiv {
        width: 100%;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="chartdiv"></div>

    <!-- Resources -->
    <script src="../../index.js"></script>
    <script src="../../wc.js"></script>
    <script src="../../themes/Animated.js"></script>
    <script src="../../plugins/json.js"></script>

    <!-- Chart code -->
    <script>
      // The chart as a JSON config. The code that builds the chart from it is below
      // how a config reads:
      // "type" is the class to create, and "settings" are what you would pass to its new() in code
      // "properties" fill in its parts: lists such as series and axes, or templates such as columns.template
      // "refs" holds objects used in more than one place: "#series-0" stands for the one named series-0
      // a string starting with "@" takes a value from another object, such as "@series.get('fill')"
      // https://www.amcharts.com/docs/v5/concepts/serializing/
      var config = {
        "type": "WordCloud",
        "settings": {
          "text": "'Tis sweet and commendable in your nature, Hamlet, to give these mourning duties to your father: but, you must know, your father lost a father; that father lost, lost his, and the survivor bound in filial obligation for some term to do obsequious sorrow: but to persever in obstinate condolement is a course of impious stubbornness; 'tis unmanly grief; it shows a will most incorrect to heaven, a heart unfortified, a mind impatient, an understanding simple and unschool'd: for what we know must be and is as common as any the most vulgar thing to sense, why should we in our peevish opposition take it to heart? Fie! 'tis a fault to heaven, a fault against the dead, a fault to nature, to reason most absurd: whose common theme is death of fathers, and who still hath cried, from the first corse till he that died to-day, 'This must be so.'",
          "maxCount": 100,
          "minWordLength": 3,
          "excludeWords": ["and", "the", "that", "but", "for"],
          "minFontSize": { "type": "Percent", "value": 4 },
          "maxFontSize": { "type": "Percent", "value": 25 },
          "angles": [0, 0, -90],
          "randomizeAngles": false,
          "autoAppear": true,
          "appearDuration": 1000,
          "appearDelay": 100
        },
        "properties": {
          "labels": {
            "properties": {
              "template": {
                "settings": {
                  "paddingTop": 5,
                  "paddingBottom": 5,
                  "paddingLeft": 5,
                  "paddingRight": 5,
                  "fontFamily": "Courier New"
                }
              }
            }
          }
        },
        "refs": []
      };


      // Create root element
      // https://www.amcharts.com/docs/v5/getting-started/#Root_element
      var root = am5.Root.new("chartdiv");


      // Set themes
      // https://www.amcharts.com/docs/v5/concepts/themes/
      root.setThemes([
        am5themes_Animated.new(root)
      ]);


      // Build the chart from its JSON config
      // https://www.amcharts.com/docs/v5/concepts/serializing/
      am5plugins_json.JsonParser.new(root).parse(config, {
        parent: root.container
      });
    </script>
  </body>
</html>
