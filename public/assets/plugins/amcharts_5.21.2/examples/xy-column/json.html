<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>amCharts 5 Example - Column Chart with Date Axis (JSON config)</title>

    <!-- Styles -->
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
        padding: 0;
        margin: 0;
        background-color: #ffffff;
      }

      #chartdiv {
        width: 100%;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="chartdiv"></div>

    <!-- Resources -->
    <script src="../../index.js"></script>
    <script src="../../xy.js"></script>
    <script src="../../themes/Animated.js"></script>
    <script src="../../plugins/json.js"></script>

    <!-- Chart code -->
    <script>
      // The chart as a JSON config. The code that builds the chart from it is below
      // how a config reads:
      // "type" is the class to create, and "settings" are what you would pass to its new() in code
      // "properties" fill in its parts: lists such as series and axes, or templates such as columns.template
      // "refs" holds objects used in more than one place: "#series-0" stands for the one named series-0
      // a string starting with "@" takes a value from another object, such as "@series.get('fill')"
      // https://www.amcharts.com/docs/v5/concepts/serializing/
      var config = {
        "type": "XYChart",
        "settings": {
          "panX": false,
          "panY": false,
          "wheelX": "panX",
          "wheelY": "zoomX",
          "cursor": {
            "type": "XYCursor",
            "settings": { "behavior": "zoomX" },
            "properties": {
              "lineY": {
                "settings": { "visible": false }
              }
            }
          },
          "scrollbarX": {
            "type": "Scrollbar",
            "settings": { "orientation": "horizontal" }
          },
          "autoAppear": true,
          "appearDuration": 1000,
          "appearDelay": 100
        },
        "properties": {
          "series": ["#series-0"],
          "xAxes": ["#axis-0"],
          "yAxes": ["#axis-1"]
        },
        "refs": [
          {
            "data-0": [
              { "date": 1704060000000, "value": 58 },
              { "date": 1704146400000, "value": 57 },
              { "date": 1704232800000, "value": 52 },
              { "date": 1704319200000, "value": 49 },
              { "date": 1704405600000, "value": 48 },
              { "date": 1704492000000, "value": 57 },
              { "date": 1704578400000, "value": 66 },
              { "date": 1704664800000, "value": 62 },
              { "date": 1704751200000, "value": 61 },
              { "date": 1704837600000, "value": 68 },
              { "date": 1704924000000, "value": 61 },
              { "date": 1705010400000, "value": 57 },
              { "date": 1705096800000, "value": 60 },
              { "date": 1705183200000, "value": 56 },
              { "date": 1705269600000, "value": 46 },
              { "date": 1705356000000, "value": 56 },
              { "date": 1705442400000, "value": 49 },
              { "date": 1705528800000, "value": 50 },
              { "date": 1705615200000, "value": 58 },
              { "date": 1705701600000, "value": 47 },
              { "date": 1705788000000, "value": 47 },
              { "date": 1705874400000, "value": 41 },
              { "date": 1705960800000, "value": 42 },
              { "date": 1706047200000, "value": 41 },
              { "date": 1706133600000, "value": 31 },
              { "date": 1706220000000, "value": 35 },
              { "date": 1706306400000, "value": 42 },
              { "date": 1706392800000, "value": 52 },
              { "date": 1706479200000, "value": 56 },
              { "date": 1706565600000, "value": 58 }
            ]
          },
          {
            "axis-0": {
              "type": "DateAxis",
              "settings": {
                "maxDeviation": 0,
                "baseInterval": { "timeUnit": "day", "count": 1 },
                "renderer": {
                  "type": "AxisRendererX",
                  "settings": { "minorGridEnabled": true }
                },
                "tooltip": { "type": "Tooltip" }
              }
            }
          },
          {
            "axis-1": {
              "type": "ValueAxis",
              "settings": {
                "min": 0,
                "renderer": { "type": "AxisRendererY" }
              }
            }
          },
          {
            "series-0": {
              "type": "ColumnSeries",
              "settings": {
                "name": "Series",
                "xAxis": "#axis-0",
                "yAxis": "#axis-1",
                "valueYField": "value",
                "valueXField": "date",
                "tooltip": {
                  "type": "Tooltip",
                  "settings": { "labelText": "{valueY}" }
                },
                "autoAppear": true,
                "appearDuration": 1000
              },
              "properties": { "data": "#data-0" }
            }
          }
        ]
      };


      // Create root element
      // https://www.amcharts.com/docs/v5/getting-started/#Root_element
      var root = am5.Root.new("chartdiv");


      // Set themes
      // https://www.amcharts.com/docs/v5/concepts/themes/
      root.setThemes([
        am5themes_Animated.new(root)
      ]);


      // Build the chart from its JSON config
      // https://www.amcharts.com/docs/v5/concepts/serializing/
      am5plugins_json.JsonParser.new(root).parse(config, {
        parent: root.container
      });
    </script>
  </body>
</html>
