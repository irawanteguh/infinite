<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>amCharts 5 Example - Dumbbell Plot (JSON config)</title>

    <!-- Styles -->
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
        padding: 0;
        margin: 0;
        background-color: #ffffff;
      }

      #chartdiv {
        width: 100%;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="chartdiv"></div>

    <!-- Resources -->
    <script src="../../index.js"></script>
    <script src="../../xy.js"></script>
    <script src="../../themes/Animated.js"></script>
    <script src="../../plugins/json.js"></script>

    <!-- Chart code -->
    <script>
      // The chart as a JSON config. The code that builds the chart from it is below
      // how a config reads:
      // "type" is the class to create, and "settings" are what you would pass to its new() in code
      // "properties" fill in its parts: lists such as series and axes, or templates such as columns.template
      // "refs" holds objects used in more than one place: "#series-0" stands for the one named series-0
      // a string starting with "@" takes a value from another object, such as "@series.get('fill')"
      // https://www.amcharts.com/docs/v5/concepts/serializing/
      var config = {
        "type": "XYChart",
        "settings": {
          "panX": true,
          "panY": true,
          "wheelX": "panX",
          "wheelY": "zoomX",
          "cursor": {
            "type": "XYCursor",
            "properties": {
              "lineY": {
                "settings": { "visible": false }
              }
            }
          },
          "autoAppear": true,
          "appearDuration": 1000,
          "appearDelay": 100
        },
        "properties": {
          "series": ["#series-0"],
          "xAxes": ["#axis-0"],
          "yAxes": ["#axis-1"]
        },
        "refs": [
          {
            "data-0": [
              { "category": "Raina", "open": 104, "close": 108 },
              { "category": "Demarcus", "open": 100, "close": 110 },
              { "category": "Carlo", "open": 105, "close": 109 },
              { "category": "Jacinda", "open": 102, "close": 111 },
              { "category": "Richie", "open": 107, "close": 113 },
              { "category": "Antony", "open": 104, "close": 111 },
              { "category": "Amada", "open": 100, "close": 112 },
              { "category": "Idalia", "open": 104, "close": 109 },
              { "category": "Janella", "open": 102, "close": 105 },
              { "category": "Marla", "open": 101, "close": 109 },
              { "category": "Curtis", "open": 101, "close": 112 },
              { "category": "Shellie", "open": 100, "close": 104 },
              { "category": "Meggan", "open": 102, "close": 112 },
              { "category": "Nathanael", "open": 105, "close": 118 },
              { "category": "Jannette", "open": 104, "close": 112 },
              { "category": "Tyrell", "open": 107, "close": 118 },
              { "category": "Sheena", "open": 104, "close": 112 },
              { "category": "Maranda", "open": 102, "close": 107 },
              { "category": "Briana", "open": 99, "close": 108 },
              { "category": "Rosa", "open": 96, "close": 109 },
              { "category": "Rosanne", "open": 96, "close": 106 },
              { "category": "Herman", "open": 99, "close": 108 },
              { "category": "Wayne", "open": 95, "close": 107 },
              { "category": "Shamika", "open": 94, "close": 104 },
              { "category": "Suk", "open": 93, "close": 105 },
              { "category": "Clair", "open": 89, "close": 95 },
              { "category": "Olivia", "open": 87, "close": 97 },
              { "category": "Hans", "open": 87, "close": 96 },
              { "category": "Glennie", "open": 85, "close": 93 }
            ]
          },
          {
            "axis-0": {
              "type": "CategoryAxis",
              "settings": {
                "maxDeviation": 0.3,
                "categoryField": "category",
                "renderer": {
                  "type": "AxisRendererX",
                  "settings": { "minGridDistance": 30, "minorGridEnabled": true },
                  "properties": {
                    "labels": {
                      "properties": {
                        "template": {
                          "settings": {
                            "rotation": -90,
                            "centerY": { "type": "Percent", "value": 50 },
                            "centerX": 0
                          }
                        }
                      }
                    }
                  }
                },
                "tooltip": { "type": "Tooltip" }
              },
              "properties": { "data": "#data-0" }
            }
          },
          {
            "axis-1": {
              "type": "ValueAxis",
              "settings": {
                "maxDeviation": 0.3,
                "renderer": { "type": "AxisRendererY" }
              }
            }
          },
          {
            "series-0": {
              "type": "ColumnSeries",
              "settings": {
                "name": "Series",
                "xAxis": "#axis-0",
                "yAxis": "#axis-1",
                "valueYField": "close",
                "openValueYField": "open",
                "categoryXField": "category",
                "tooltip": {
                  "type": "Tooltip",
                  "settings": { "labelText": "{openValueY} - {valueY}" }
                },
                "autoAppear": true,
                "appearDuration": 1000
              },
              "properties": {
                "data": "#data-0",
                "columns": {
                  "properties": {
                    "template": {
                      "settings": { "width": 0.5 }
                    }
                  }
                },
                "bullets": [
                  {
                    "type": "Bullet",
                    "settings": {
                      "locationY": 0,
                      "sprite": {
                        "type": "Circle",
                        "settings": { "radius": 5, "fill": "@series.get('fill')" }
                      }
                    }
                  },
                  {
                    "type": "Bullet",
                    "settings": {
                      "locationY": 1,
                      "sprite": {
                        "type": "Circle",
                        "settings": {
                          "radius": 5,
                          "fill": { "type": "Color", "value": "#6794dc" }
                        }
                      }
                    }
                  }
                ]
              }
            }
          }
        ]
      };


      // Create root element
      // https://www.amcharts.com/docs/v5/getting-started/#Root_element
      var root = am5.Root.new("chartdiv");


      // Set themes
      // https://www.amcharts.com/docs/v5/concepts/themes/
      root.setThemes([
        am5themes_Animated.new(root)
      ]);


      // Build the chart from its JSON config
      // https://www.amcharts.com/docs/v5/concepts/serializing/
      am5plugins_json.JsonParser.new(root).parse(config, {
        parent: root.container
      });
    </script>
  </body>
</html>
