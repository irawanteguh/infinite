<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>amCharts 5 Example - Pulsing Last Bullet (JSON config)</title>

    <!-- Styles -->
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
        padding: 0;
        margin: 0;
        background-color: #ffffff;
      }

      #chartdiv {
        width: 100%;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="chartdiv"></div>

    <!-- Resources -->
    <script src="../../index.js"></script>
    <script src="../../xy.js"></script>
    <script src="../../themes/Animated.js"></script>
    <script src="../../plugins/json.js"></script>

    <!-- Chart code -->
    <script>
      // The chart as a JSON config. The code that builds the chart from it is below
      // how a config reads:
      // "type" is the class to create, and "settings" are what you would pass to its new() in code
      // "properties" fill in its parts: lists such as series and axes, or templates such as columns.template
      // "refs" holds objects used in more than one place: "#series-0" stands for the one named series-0
      // a string starting with "@" takes a value from another object, such as "@series.get('fill')"
      // https://www.amcharts.com/docs/v5/concepts/serializing/
      var config = {
        "type": "XYChart",
        "settings": {
          "panX": true,
          "panY": true,
          "wheelX": "panX",
          "wheelY": "zoomX",
          "cursor": {
            "type": "XYCursor",
            "properties": {
              "lineY": {
                "settings": { "visible": false }
              }
            }
          },
          "autoAppear": true,
          "appearDuration": 1000,
          "appearDelay": 100
        },
        "properties": {
          "series": ["#series-0"],
          "xAxes": ["#axis-0"],
          "yAxes": ["#axis-1"]
        },
        "refs": [
          {
            "data-0": [
              { "date": 1717189200000, "value": 50 },
              { "date": 1717275600000, "value": 53 },
              { "date": 1717362000000, "value": 56 },
              { "date": 1717448400000, "value": 52 },
              { "date": 1717534800000, "value": 48 },
              { "date": 1717621200000, "value": 47 },
              { "date": 1717707600000, "value": 51 },
              { "date": 1717794000000, "value": 55 },
              { "date": 1717880400000, "value": 54 },
              { "date": 1717966800000, "value": 58 },
              { "date": 1718053200000, "value": 62 },
              { "date": 1718139600000, "value": 60 },
              { "date": 1718226000000, "value": 57 },
              { "date": 1718312400000, "value": 61 },
              {
                "date": 1718398800000,
                "value": 65,
                "bulletSettings": { "visible": true },
                "__parse": true
              }
            ]
          },
          {
            "template-0": {
              "type": "Template",
              "settings": { "visible": false }
            }
          },
          {
            "axis-0": {
              "type": "DateAxis",
              "settings": {
                "maxDeviation": 0.3,
                "baseInterval": { "timeUnit": "day", "count": 1 },
                "renderer": {
                  "type": "AxisRendererX",
                  "settings": { "minorGridEnabled": true }
                },
                "tooltip": { "type": "Tooltip" }
              }
            }
          },
          {
            "axis-1": {
              "type": "ValueAxis",
              "settings": {
                "maxDeviation": 0.3,
                "renderer": { "type": "AxisRendererY" }
              }
            }
          },
          {
            "series-0": {
              "type": "LineSeries",
              "settings": {
                "name": "Series",
                "xAxis": "#axis-0",
                "yAxis": "#axis-1",
                "valueYField": "value",
                "valueXField": "date",
                "tooltip": {
                  "type": "Tooltip",
                  "settings": { "labelText": "{valueY}" }
                },
                "autoAppear": true,
                "appearDuration": 1000
              },
              "properties": {
                "data": "#data-0",
                "strokes": {
                  "properties": {
                    "template": {
                      "settings": { "strokeWidth": 2 }
                    }
                  }
                },
                "bullets": [
                  {
                    "type": "Bullet",
                    "settings": {
                      "sprite": {
                        "type": "Container",
                        "settings": { "templateField": "bulletSettings" },
                        "children": [
                          {
                            "type": "Circle",
                            "settings": {
                              "radius": 5,
                              "fill": { "type": "Color", "value": "#67b7dc" }
                            }
                          },
                          {
                            "type": "Circle",
                            "settings": {
                              "radius": 5,
                              "fill": { "type": "Color", "value": "#67b7dc" },
                              "animations": [
                                {
                                  "key": "scale",
                                  "from": 1,
                                  "to": 4,
                                  "duration": 1000,
                                  "easing": "cubic",
                                  "ease": "out",
                                  "loops": 0
                                },
                                {
                                  "key": "opacity",
                                  "from": 1,
                                  "to": 0,
                                  "duration": 1000,
                                  "easing": "cubic",
                                  "ease": "out",
                                  "loops": 0
                                }
                              ]
                            }
                          }
                        ],
                        "properties": { "template": "#template-0" }
                      }
                    }
                  }
                ]
              }
            }
          }
        ]
      };


      // Create root element
      // https://www.amcharts.com/docs/v5/getting-started/#Root_element
      var root = am5.Root.new("chartdiv");


      // Set themes
      // https://www.amcharts.com/docs/v5/concepts/themes/
      root.setThemes([
        am5themes_Animated.new(root)
      ]);


      // Build the chart from its JSON config
      // https://www.amcharts.com/docs/v5/concepts/serializing/
      am5plugins_json.JsonParser.new(root).parse(config, {
        parent: root.container
      });
    </script>
  </body>
</html>
