<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>amCharts 5 Example - Stacked and Clustered Columns (JSON config)</title>

    <!-- Styles -->
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
        padding: 0;
        margin: 0;
        background-color: #ffffff;
      }

      #chartdiv {
        width: 100%;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="chartdiv"></div>

    <!-- Resources -->
    <script src="../../index.js"></script>
    <script src="../../xy.js"></script>
    <script src="../../themes/Animated.js"></script>
    <script src="../../plugins/json.js"></script>

    <!-- Chart code -->
    <script>
      // The chart as a JSON config. The code that builds the chart from it is below
      // how a config reads:
      // "type" is the class to create, and "settings" are what you would pass to its new() in code
      // "properties" fill in its parts: lists such as series and axes, or templates such as columns.template
      // "refs" holds objects used in more than one place: "#series-0" stands for the one named series-0
      // a string starting with "@" takes a value from another object, such as "@series.get('fill')"
      // https://www.amcharts.com/docs/v5/concepts/serializing/
      var config = {
        "type": "XYChart",
        "settings": {
          "panX": false,
          "panY": false,
          "wheelX": "panX",
          "wheelY": "zoomX",
          "layout": { "type": "VerticalLayout" },
          "autoAppear": true,
          "appearDuration": 1000,
          "appearDelay": 100
        },
        "properties": {
          "series": ["#series-0", "#series-1", "#series-2", "#series-3", "#series-4", "#series-5"],
          "xAxes": ["#axis-0"],
          "yAxes": ["#axis-1"]
        },
        "children": [
          {
            "type": "Legend",
            "settings": {
              "centerX": { "type": "Percent", "value": 50 },
              "x": { "type": "Percent", "value": 50 }
            },
            "properties": {
              "data": ["#series-0", "#series-1", "#series-2", "#series-3", "#series-4", "#series-5"]
            }
          }
        ],
        "refs": [
          {
            "data-0": [
              {
                "year": "2021",
                "europe": 2.5,
                "namerica": 2.5,
                "asia": 2.1,
                "lamerica": 1,
                "meast": 0.8,
                "africa": 0.4
              },
              {
                "year": "2022",
                "europe": 2.6,
                "namerica": 2.7,
                "asia": 2.2,
                "lamerica": 0.5,
                "meast": 0.4,
                "africa": 0.3
              },
              {
                "year": "2023",
                "europe": 2.8,
                "namerica": 2.9,
                "asia": 2.4,
                "lamerica": 0.3,
                "meast": 0.9,
                "africa": 0.5
              }
            ]
          },
          {
            "axis-0": {
              "type": "CategoryAxis",
              "settings": {
                "categoryField": "year",
                "renderer": {
                  "type": "AxisRendererX",
                  "settings": { "cellStartLocation": 0.1, "cellEndLocation": 0.9 }
                }
              },
              "properties": { "data": "#data-0" }
            }
          },
          {
            "axis-1": {
              "type": "ValueAxis",
              "settings": {
                "min": 0,
                "renderer": { "type": "AxisRendererY" }
              }
            }
          },
          {
            "series-0": {
              "type": "ColumnSeries",
              "settings": {
                "name": "Europe",
                "stacked": false,
                "xAxis": "#axis-0",
                "yAxis": "#axis-1",
                "valueYField": "europe",
                "categoryXField": "year",
                "autoAppear": true,
                "appearDuration": 1000
              },
              "properties": {
                "data": "#data-0",
                "columns": {
                  "properties": {
                    "template": {
                      "settings": {
                        "tooltipText": "{name}, {categoryX}: {valueY}",
                        "width": { "type": "Percent", "value": 90 },
                        "tooltipY": { "type": "Percent", "value": 10 }
                      }
                    }
                  }
                },
                "bullets": [
                  {
                    "type": "Bullet",
                    "settings": {
                      "locationY": 0.5,
                      "sprite": {
                        "type": "Label",
                        "settings": {
                          "text": "{valueY}",
                          "fill": { "type": "Color", "value": "#ffffff" },
                          "centerY": { "type": "Percent", "value": 50 },
                          "centerX": { "type": "Percent", "value": 50 },
                          "populateText": true
                        }
                      }
                    }
                  }
                ]
              }
            }
          },
          {
            "series-1": {
              "type": "ColumnSeries",
              "settings": {
                "name": "North America",
                "stacked": true,
                "xAxis": "#axis-0",
                "yAxis": "#axis-1",
                "valueYField": "namerica",
                "categoryXField": "year",
                "autoAppear": true,
                "appearDuration": 1000
              },
              "properties": {
                "data": "#data-0",
                "columns": {
                  "properties": {
                    "template": {
                      "settings": {
                        "tooltipText": "{name}, {categoryX}: {valueY}",
                        "width": { "type": "Percent", "value": 90 },
                        "tooltipY": { "type": "Percent", "value": 10 }
                      }
                    }
                  }
                },
                "bullets": [
                  {
                    "type": "Bullet",
                    "settings": {
                      "locationY": 0.5,
                      "sprite": {
                        "type": "Label",
                        "settings": {
                          "text": "{valueY}",
                          "fill": { "type": "Color", "value": "#ffffff" },
                          "centerY": { "type": "Percent", "value": 50 },
                          "centerX": { "type": "Percent", "value": 50 },
                          "populateText": true
                        }
                      }
                    }
                  }
                ]
              }
            }
          },
          {
            "series-2": {
              "type": "ColumnSeries",
              "settings": {
                "name": "Asia",
                "stacked": false,
                "xAxis": "#axis-0",
                "yAxis": "#axis-1",
                "valueYField": "asia",
                "categoryXField": "year",
                "autoAppear": true,
                "appearDuration": 1000
              },
              "properties": {
                "data": "#data-0",
                "columns": {
                  "properties": {
                    "template": {
                      "settings": {
                        "tooltipText": "{name}, {categoryX}: {valueY}",
                        "width": { "type": "Percent", "value": 90 },
                        "tooltipY": { "type": "Percent", "value": 10 }
                      }
                    }
                  }
                },
                "bullets": [
                  {
                    "type": "Bullet",
                    "settings": {
                      "locationY": 0.5,
                      "sprite": {
                        "type": "Label",
                        "settings": {
                          "text": "{valueY}",
                          "fill": { "type": "Color", "value": "#ffffff" },
                          "centerY": { "type": "Percent", "value": 50 },
                          "centerX": { "type": "Percent", "value": 50 },
                          "populateText": true
                        }
                      }
                    }
                  }
                ]
              }
            }
          },
          {
            "series-3": {
              "type": "ColumnSeries",
              "settings": {
                "name": "Latin America",
                "stacked": true,
                "xAxis": "#axis-0",
                "yAxis": "#axis-1",
                "valueYField": "lamerica",
                "categoryXField": "year",
                "autoAppear": true,
                "appearDuration": 1000
              },
              "properties": {
                "data": "#data-0",
                "columns": {
                  "properties": {
                    "template": {
                      "settings": {
                        "tooltipText": "{name}, {categoryX}: {valueY}",
                        "width": { "type": "Percent", "value": 90 },
                        "tooltipY": { "type": "Percent", "value": 10 }
                      }
                    }
                  }
                },
                "bullets": [
                  {
                    "type": "Bullet",
                    "settings": {
                      "locationY": 0.5,
                      "sprite": {
                        "type": "Label",
                        "settings": {
                          "text": "{valueY}",
                          "fill": { "type": "Color", "value": "#ffffff" },
                          "centerY": { "type": "Percent", "value": 50 },
                          "centerX": { "type": "Percent", "value": 50 },
                          "populateText": true
                        }
                      }
                    }
                  }
                ]
              }
            }
          },
          {
            "series-4": {
              "type": "ColumnSeries",
              "settings": {
                "name": "Middle East",
                "stacked": true,
                "xAxis": "#axis-0",
                "yAxis": "#axis-1",
                "valueYField": "meast",
                "categoryXField": "year",
                "autoAppear": true,
                "appearDuration": 1000
              },
              "properties": {
                "data": "#data-0",
                "columns": {
                  "properties": {
                    "template": {
                      "settings": {
                        "tooltipText": "{name}, {categoryX}: {valueY}",
                        "width": { "type": "Percent", "value": 90 },
                        "tooltipY": { "type": "Percent", "value": 10 }
                      }
                    }
                  }
                },
                "bullets": [
                  {
                    "type": "Bullet",
                    "settings": {
                      "locationY": 0.5,
                      "sprite": {
                        "type": "Label",
                        "settings": {
                          "text": "{valueY}",
                          "fill": { "type": "Color", "value": "#ffffff" },
                          "centerY": { "type": "Percent", "value": 50 },
                          "centerX": { "type": "Percent", "value": 50 },
                          "populateText": true
                        }
                      }
                    }
                  }
                ]
              }
            }
          },
          {
            "series-5": {
              "type": "ColumnSeries",
              "settings": {
                "name": "Africa",
                "stacked": true,
                "xAxis": "#axis-0",
                "yAxis": "#axis-1",
                "valueYField": "africa",
                "categoryXField": "year",
                "autoAppear": true,
                "appearDuration": 1000
              },
              "properties": {
                "data": "#data-0",
                "columns": {
                  "properties": {
                    "template": {
                      "settings": {
                        "tooltipText": "{name}, {categoryX}: {valueY}",
                        "width": { "type": "Percent", "value": 90 },
                        "tooltipY": { "type": "Percent", "value": 10 }
                      }
                    }
                  }
                },
                "bullets": [
                  {
                    "type": "Bullet",
                    "settings": {
                      "locationY": 0.5,
                      "sprite": {
                        "type": "Label",
                        "settings": {
                          "text": "{valueY}",
                          "fill": { "type": "Color", "value": "#ffffff" },
                          "centerY": { "type": "Percent", "value": 50 },
                          "centerX": { "type": "Percent", "value": 50 },
                          "populateText": true
                        }
                      }
                    }
                  }
                ]
              }
            }
          }
        ]
      };


      // Create root element
      // https://www.amcharts.com/docs/v5/getting-started/#Root_element
      var root = am5.Root.new("chartdiv");


      // Set themes
      // https://www.amcharts.com/docs/v5/concepts/themes/
      root.setThemes([
        am5themes_Animated.new(root)
      ]);


      // Build the chart from its JSON config
      // https://www.amcharts.com/docs/v5/concepts/serializing/
      am5plugins_json.JsonParser.new(root).parse(config, {
        parent: root.container
      });
    </script>
  </body>
</html>
