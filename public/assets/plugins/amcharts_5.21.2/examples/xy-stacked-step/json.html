<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>amCharts 5 Example - Stacked Step Line Chart (JSON config)</title>

    <!-- Styles -->
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
        padding: 0;
        margin: 0;
        background-color: #ffffff;
      }

      #chartdiv {
        width: 100%;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="chartdiv"></div>

    <!-- Resources -->
    <script src="../../index.js"></script>
    <script src="../../xy.js"></script>
    <script src="../../themes/Animated.js"></script>
    <script src="../../plugins/json.js"></script>

    <!-- Chart code -->
    <script>
      // The chart as a JSON config. The code that builds the chart from it is below
      // how a config reads:
      // "type" is the class to create, and "settings" are what you would pass to its new() in code
      // "properties" fill in its parts: lists such as series and axes, or templates such as columns.template
      // "refs" holds objects used in more than one place: "#series-0" stands for the one named series-0
      // a string starting with "@" takes a value from another object, such as "@series.get('fill')"
      // https://www.amcharts.com/docs/v5/concepts/serializing/
      var config = {
        "type": "XYChart",
        "settings": {
          "panX": true,
          "panY": true,
          "wheelX": "panX",
          "wheelY": "zoomX",
          "cursor": {
            "type": "XYCursor",
            "properties": {
              "lineY": {
                "settings": { "visible": false }
              }
            }
          },
          "scrollbarX": {
            "type": "Scrollbar",
            "settings": { "orientation": "horizontal" }
          },
          "autoAppear": true,
          "appearDuration": 1000,
          "appearDelay": 100
        },
        "properties": {
          "series": ["#series-0", "#series-1"],
          "xAxes": ["#axis-0"],
          "yAxes": ["#axis-1"]
        },
        "refs": [
          {
            "data-0": [
              { "date": 1704067200000, "value1": 102, "value2": 21 },
              { "date": 1704153600000, "value1": 104, "value2": 19 },
              { "date": 1704240000000, "value1": 103, "value2": 18 },
              { "date": 1704326400000, "value1": 99, "value2": 20 },
              { "date": 1704412800000, "value1": 102, "value2": 21 },
              { "date": 1704499200000, "value1": 100, "value2": 22 },
              { "date": 1704585600000, "value1": 101, "value2": 22 },
              { "date": 1704672000000, "value1": 103, "value2": 20 },
              { "date": 1704758400000, "value1": 105, "value2": 21 },
              { "date": 1704844800000, "value1": 108, "value2": 20 },
              { "date": 1704931200000, "value1": 112, "value2": 21 },
              { "date": 1705017600000, "value1": 115, "value2": 22 },
              { "date": 1705104000000, "value1": 120, "value2": 23 },
              { "date": 1705190400000, "value1": 121, "value2": 21 },
              { "date": 1705276800000, "value1": 118, "value2": 20 },
              { "date": 1705363200000, "value1": 120, "value2": 19 },
              { "date": 1705449600000, "value1": 118, "value2": 20 },
              { "date": 1705536000000, "value1": 119, "value2": 22 },
              { "date": 1705622400000, "value1": 122, "value2": 23 },
              { "date": 1705708800000, "value1": 126, "value2": 22 },
              { "date": 1705795200000, "value1": 125, "value2": 21 },
              { "date": 1705881600000, "value1": 121, "value2": 22 },
              { "date": 1705968000000, "value1": 116, "value2": 22 },
              { "date": 1706054400000, "value1": 111, "value2": 22 },
              { "date": 1706140800000, "value1": 115, "value2": 24 },
              { "date": 1706227200000, "value1": 117, "value2": 25 },
              { "date": 1706313600000, "value1": 117, "value2": 25 },
              { "date": 1706400000000, "value1": 113, "value2": 27 },
              { "date": 1706486400000, "value1": 115, "value2": 29 },
              { "date": 1706572800000, "value1": 118, "value2": 28 }
            ]
          },
          {
            "axis-0": {
              "type": "DateAxis",
              "settings": {
                "baseInterval": { "timeUnit": "day", "count": 1 },
                "renderer": {
                  "type": "AxisRendererX",
                  "settings": { "minorGridEnabled": true }
                },
                "tooltip": { "type": "Tooltip" }
              }
            }
          },
          {
            "axis-1": {
              "type": "ValueAxis",
              "settings": {
                "renderer": {
                  "type": "AxisRendererY",
                  "settings": { "minorGridEnabled": true, "minGridDistance": 70 }
                }
              }
            }
          },
          {
            "series-0": {
              "type": "StepLineSeries",
              "settings": {
                "name": "Series 1",
                "xAxis": "#axis-0",
                "yAxis": "#axis-1",
                "valueYField": "value1",
                "valueXField": "date",
                "tooltip": {
                  "type": "Tooltip",
                  "settings": { "labelText": "{name}: {valueY}" }
                },
                "autoAppear": true,
                "appearDuration": 1000
              },
              "properties": {
                "data": "#data-0",
                "fills": {
                  "properties": {
                    "template": {
                      "settings": { "fillOpacity": 0.5, "visible": true }
                    }
                  }
                }
              }
            }
          },
          {
            "series-1": {
              "type": "StepLineSeries",
              "settings": {
                "name": "Series 2",
                "stacked": true,
                "xAxis": "#axis-0",
                "yAxis": "#axis-1",
                "valueYField": "value2",
                "valueXField": "date",
                "tooltip": {
                  "type": "Tooltip",
                  "settings": { "labelText": "{name}: {valueY}" }
                },
                "autoAppear": true,
                "appearDuration": 1000
              },
              "properties": {
                "data": "#data-0",
                "fills": {
                  "properties": {
                    "template": {
                      "settings": { "fillOpacity": 0.5, "visible": true }
                    }
                  }
                }
              }
            }
          }
        ]
      };


      // Create root element
      // https://www.amcharts.com/docs/v5/getting-started/#Root_element
      var root = am5.Root.new("chartdiv");


      // Set themes
      // https://www.amcharts.com/docs/v5/concepts/themes/
      root.setThemes([
        am5themes_Animated.new(root)
      ]);


      // Build the chart from its JSON config
      // https://www.amcharts.com/docs/v5/concepts/serializing/
      am5plugins_json.JsonParser.new(root).parse(config, {
        parent: root.container
      });
    </script>
  </body>
</html>
